<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хомяк на шарике — Мультиплеер</title>
    <!-- Подключаем бесплатный WebRTC для мультиплеера -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f121d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border-radius: 16px;
            overflow: hidden;
            width: 400px;
            height: 600px;
            background: #1a1a1a;
        }
        canvas { display: block; }
        .ui-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: rgba(25, 20, 35, 0.92);
            backdrop-filter: blur(6px);
            z-index: 10;
        }
        .hidden { display: none !important; }
        h1 { color: #ff5e7e; font-size: 28px; margin-bottom: 20px; text-shadow: 0 4px 10px rgba(255, 94, 126, 0.4); }
        .btn {
            background: linear-gradient(135deg, #ff5e7e, #e63956);
            color: white; border: none; padding: 12px 24px; margin: 6px;
            border-radius: 30px; font-size: 16px; font-weight: bold;
            cursor: pointer; box-shadow: 0 6px 15px rgba(230, 57, 86, 0.4);
            transition: all 0.15s ease; width: 220px; text-align: center; text-transform: uppercase;
        }
        .btn:hover { transform: translateY(-2px); }
        input[type="text"] {
            padding: 10px 15px; border-radius: 20px; border: 2px solid #ff5e7e;
            outline: none; font-size: 16px; text-align: center; width: 200px; margin-bottom: 10px;
            background: #2a2035; color: white;
        }
        .info-text { color: #aaa; font-size: 13px; margin-top: 5px; text-align: center; padding: 0 20px; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    
    <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="main-menu" class="ui-screen">
        <h1>Хомяк на шарике</h1>
        <button class="btn" onclick="startSinglePlayer()">Соло игра</button>
        <button class="btn" style="background: linear-gradient(135deg, #3498db, #2980b9);" onclick="openMultiMenu()">Мультиплеер</button>
    </div>

    <!-- МЕНЮ МУЛЬТИПЛЕЕРА -->
    <div id="mp-menu" class="ui-screen hidden">
        <h1>Мультиплеер</h1>
        <div id="mp-status" class="info-text" style="color:#ff5e7e; margin-bottom:15px;"></div>
        
        <button class="btn" onclick="createRoom()">Создать комнату</button>
        <div style="color:#fff; margin: 10px 0;">или</div>
        
        <input type="text" id="room-code-input" placeholder="Код комнаты">
        <button class="btn" style="background: linear-gradient(135deg, #2ecc71, #27ae60);" onclick="joinRoom()">Войти по коду</button>
        
        <button class="btn" style="background: #555; margin-top: 15px;" onclick="closeMultiMenu()">Назад</button>
    </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let gameState = "MENU"; // MENU, PLAYING, GAMEOVER
let isMultiplayer = false;
let isHost = false;

// Сетевые переменные (PeerJS)
let peer = null;
let conn = null;
let myPeerId = "";

// Игроки
const player1 = { x: 80, y: 250, radius: 15, velocity: 0, color: "#ff5e7e", hColor: "#d49b4b", isPopped: false };
const player2 = { x: 80, y: 250, radius: 15, velocity: 0, color: "#3498db", hColor: "#7f8c8d", isPopped: false };

let gravity = 1100;
let jumpForce = -340;
let score = 0;
let gameSpeed = 160;

// Препятствия (Синхронизируются с Хостом)
let obstacles = [];
let spawnTimer = 0;

// Управление P2P Сетью
function initPeer() {
    if (peer) return;
    document.getElementById("mp-status").innerText = "Подключение к серверу...";
    peer = new Peer();

    peer.on('open', (id) => {
        myPeerId = id;
        document.getElementById("mp-status").innerText = "Готов к подключению.";
    });

    peer.on('connection', (c) => {
        conn = c;
        isHost = true;
        setupConnection();
    });

    peer.on('error', (err) => {
        document.getElementById("mp-status").innerText = "Ошибка сети!";
    });
}

function createRoom() {
    initPeer();
    if (!myPeerId) return;
    let shortId = myPeerId.substring(0, 5);
    prompt("Поделитесь этим кодом с другом:", myPeerId);
    document.getElementById("mp-status").innerText = "Ожидание второго игрока...";
}

function joinRoom() {
    initPeer();
    let code = document.getElementById("room-code-input").value.trim();
    if (!code) return;

    conn = peer.connect(code);
    isHost = false;
    setupConnection();
}

function setupConnection() {
    conn.on('open', () => {
        isMultiplayer = true;
        document.getElementById("mp-menu").classList.add("hidden");
        resetGame();
    });

    conn.on('data', (data) => {
        if (data.type === 'POS') {
            player2.y = data.y;
            player2.isPopped = data.isPopped;
        }
        if (data.type === 'OBS' && !isHost) {
            obstacles = data.obstacles;
            score = data.score;
        }
        if (data.type === 'JUMP') {
            player2.velocity = jumpForce;
        }
    });
}

// Отрисовка Компактного Хомяка
function drawHamster(p) {
    ctx.save();
    ctx.translate(p.x, p.y);

    if (!p.isPopped) {
        // Шарик
        ctx.beginPath();
        ctx.arc(0, -16, 17, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.stroke();

        // Ниточка
        ctx.beginPath();
        ctx.moveTo(0, 1); ctx.lineTo(0, 12);
        ctx.strokeStyle = "#444"; ctx.stroke();
    }

    // Тело Хомяка
    ctx.beginPath();
    ctx.ellipse(0, 20, 12, 10, 0, 0, Math.PI * 2);
    ctx.fillStyle = p.hColor;
    ctx.fill();
    ctx.stroke();

    // Мордочка
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(-3, 17, 2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(3, 17, 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.arc(-3, 17, 1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(3, 17, 1, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
}

function update(dt) {
    if (gameState !== "PLAYING") return;

    // Логика 1-го Игрока
    player1.velocity += gravity * dt;
    player1.y += player1.velocity * dt;

    if (player1.y + 25 >= canvas.height - 40 || player1.y - 30 <= 0) {
        player1.isPopped = true;
        gameState = "GAMEOVER";
    }

    // Отправляем свои координаты партнёру
    if (isMultiplayer && conn && conn.open) {
        conn.send({ type: 'POS', y: player1.y, isPopped: player1.isPopped });
    }

    // Спавн и генерация кактусов (Только Хост)
    if (!isMultiplayer || isHost) {
        spawnTimer += dt;
        if (spawnTimer >= 1.5) {
            spawnTimer = 0;
            let gap = 145;
            let top = Math.random() * (canvas.height - gap - 160) + 50;
            obstacles.push({ x: canvas.width, top: top, bottom: top + gap, passed: false });
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
            let o = obstacles[i];
            o.x -= gameSpeed * dt;

            if (!o.passed && o.x < player1.x) {
                score++;
                o.passed = true;
            }

            // Проверка столкновений P1
            if (player1.x + player1.radius > o.x && player1.x - player1.radius < o.x + 50) {
                if (player1.y - 20 < o.top || player1.y + 20 > o.bottom) {
                    player1.isPopped = true;
                    gameState = "GAMEOVER";
                }
            }

            if (o.x < -60) obstacles.splice(i, 1);
        }

        if (isMultiplayer && conn && conn.open) {
            conn.send({ type: 'OBS', obstacles: obstacles, score: score });
        }
    }
}

function draw() {
    // Фон
    ctx.fillStyle = '#f7d6c1';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Пол
    ctx.fillStyle = '#5c3a2f';
    ctx.fillRect(0, canvas.height - 40, canvas.width, 40);

    // Кактусы
    ctx.fillStyle = '#2e7d32';
    obstacles.forEach(o => {
        ctx.fillRect(o.x, 0, 50, o.top);
        ctx.fillRect(o.x, o.bottom, 50, canvas.height - o.bottom - 40);
    });

    // Рисуем игроков
    drawHamster(player1);
    if (isMultiplayer) drawHamster(player2);

    // Счет
    ctx.fillStyle = "#333";
    ctx.font = "bold 20px sans-serif";
    ctx.fillText(`Счёт: ${score}`, 20, 35);

    if (gameState === "GAMEOVER") {
        ctx.fillStyle = "rgba(0,0,0,0.7)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fff";
        ctx.font = "bold 30px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("ИГРА ОКОНЧЕНА", canvas.width / 2, canvas.height / 2);
        ctx.font = "16px sans-serif";
        ctx.fillText("Нажмите Клик/Пробел для рестарта", canvas.width / 2, canvas.height / 2 + 40);
        ctx.textAlign = "left";
    }
}

function resetGame() {
    player1.y = 250; player1.velocity = 0; player1.isPopped = false;
    player2.y = 250; player2.velocity = 0; player2.isPopped = false;
    obstacles = [];
    score = 0;
    gameState = "PLAYING";
}

function handleJump() {
    if (gameState === "PLAYING") {
        player1.velocity = jumpForce;
        if (isMultiplayer && conn && conn.open) conn.send({ type: 'JUMP' });
    } else if (gameState === "GAMEOVER") {
        resetGame();
    }
}

window.addEventListener("keydown", (e) => { if (e.code === "Space") handleJump(); });
canvas.addEventListener("click", handleJump);

function openMultiMenu() {
    initPeer();
    document.getElementById("main-menu").classList.add("hidden");
    document.getElementById("mp-menu").classList.remove("hidden");
}

function closeMultiMenu() {
    document.getElementById("mp-menu").classList.add("hidden");
    document.getElementById("main-menu").classList.remove("hidden");
}

function startSinglePlayer() {
    isMultiplayer = false;
    document.getElementById("main-menu").classList.add("hidden");
    resetGame();
}

let lastTime = performance.now();
function loop(now) {
    let dt = (now - lastTime) / 1000;
    if (dt > 0.1) dt = 0.1;
    lastTime = now;

    update(dt);
    draw();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

</body>
</html>
