<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хомяк на шарике — High HD Graphics</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f121d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border-radius: 16px;
            overflow: hidden;
            width: 400px;
            height: 600px;
            background: #1a1a1a;
        }
        canvas {
            display: block;
            transform: translateZ(0);
            will-change: transform;
        }
        .ui-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(25, 20, 35, 0.92);
            backdrop-filter: blur(6px);
            z-index: 10;
        }
        .hidden { display: none !important; }
        h1 {
            color: #ff5e7e;
            font-size: 32px;
            margin-bottom: 25px;
            text-shadow: 0 4px 10px rgba(255, 94, 126, 0.4);
            font-weight: 800;
        }
        h2 { color: #fceade; font-size: 18px; margin: 15px 0 10px 0; }
        
        .btn {
            background: linear-gradient(135deg, #ff5e7e, #e63956);
            color: white;
            border: none;
            padding: 14px 30px;
            margin: 8px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(230, 57, 86, 0.4);
            transition: all 0.15s ease;
            width: 210px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(230, 57, 86, 0.6); }
        .btn:active { transform: translateY(0); }
        
        .seeds-counter {
            position: absolute;
            top: 15px;
            right: 15px;
            font-weight: bold;
            font-size: 16px;
            color: #fff;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.5);
            backdrop-filter: blur(4px);
        }

        .shop-section { width: 90%; max-height: 400px; overflow-y: auto; text-align: center; }
        .shop-grid { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .shop-item {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px;
            width: 95px;
            cursor: pointer;
            font-size: 12px;
            color: #fff;
            font-weight: bold;
            transition: all 0.2s;
        }
        .shop-item.active { border-color: #2ecc71; background: rgba(46, 204, 113, 0.2); }
        .shop-item.bought { border-color: #ff5e7e; }
        .item-preview { width: 34px; height: 34px; border-radius: 50%; margin: 6px auto; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    
    <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="main-menu" class="ui-screen">
        <h1>Хомяк на шарике</h1>
        <div class="seeds-counter">🌻 <span class="seeds-val">0</span></div>
        <button class="btn" onclick="startGame()">Играть</button>
        <button class="btn" style="background: linear-gradient(135deg, #2ecc71, #27ae60);" onclick="openShop()">Магазин</button>
    </div>

    <!-- МАГАЗИН -->
    <div id="shop-menu" class="ui-screen hidden">
        <h1>Магазин</h1>
        <div class="seeds-counter">🌻 <span class="seeds-val">0</span></div>
        
        <div class="shop-section">
            <h2>Цвет шарика (15 🌻)</h2>
            <div class="shop-grid" id="balloon-shop"></div>

            <h2>Цвет хомяка (20 🌻)</h2>
            <div class="shop-grid" id="hamster-shop"></div>
        </div>

        <button class="btn" style="margin-top: 20px;" onclick="closeShop()">Назад</button>
    </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Сохранения
let seedsData = parseInt(localStorage.getItem("hamster_seeds")) || 0;
let highScore = parseInt(localStorage.getItem("hamster_highscore")) || 0;
let ownedSkins = JSON.parse(localStorage.getItem("hamster_skins")) || {
    balloon: ["#ff5e7e"],
    hamster: ["#d49b4b"]
};
let currentBalloon = localStorage.getItem("hamster_cur_balloon") || "#ff5e7e";
let currentHamster = localStorage.getItem("hamster_cur_hamster") || "#d49b4b";

const BALLOON_COLORS = [
    { name: "Розовый", color: "#ff5e7e", price: 0 },
    { name: "Зеленый", color: "#2ecc71", price: 15 },
    { name: "Синий", color: "#3498db", price: 15 },
    { name: "Золотой", color: "#f1c40f", price: 30 }
];

const HAMSTER_COLORS = [
    { name: "Рыжий", color: "#d49b4b", price: 0 },
    { name: "Темный", color: "#34495e", price: 20 },
    { name: "Серый", color: "#7f8c8d", price: 20 },
    { name: "Персик", color: "#e67e22", price: 20 }
];

let gameState = "MENU";
let score = 0;
let seedsInGame = 0;
let gameSpeed = 160;
let spawnTimer = 0;

let shieldTime = 0;
let boostTime = 0;

// Object Pools
const OBSTACLE_POOL_SIZE = 8;
const SEED_POOL_SIZE = 8;
const POWERUP_POOL_SIZE = 4;
const PARTICLE_POOL_SIZE = 30;

const obstaclePool = Array.from({ length: OBSTACLE_POOL_SIZE }, () => ({
    x: 0, topHeight: 0, bottomY: 0, width: 54, gap: 145, active: false, passed: false
}));

const seedPool = Array.from({ length: SEED_POOL_SIZE }, () => ({
    x: 0, y: 0, radius: 12, rotation: 0, active: false
}));

const powerupPool = Array.from({ length: POWERUP_POOL_SIZE }, () => ({
    x: 0, y: 0, radius: 16, type: 'SHIELD', active: false
}));

const particlesPool = Array.from({ length: PARTICLE_POOL_SIZE }, () => ({
    x: 0, y: 0, size: 0, vx: 0, vy: 0, alpha: 0, active: false
}));

// Детализированный хомяк
const hamster = {
    x: 80,
    y: 250,
    radius: 20,
    gravity: 1100,
    jumpForce: -350,
    velocity: 0,
    rotation: 0,
    isPopped: false,

    draw() {
        let hx = this.x | 0;
        let hy = this.y | 0;

        ctx.save();
        ctx.translate(hx, hy);

        let tilt = Math.min(Math.max(this.velocity / 600, -0.4), 0.4);
        if (!this.isPopped) ctx.rotate(tilt);

        // 1. Воздушный шар
        if (!this.isPopped) {
            // Тень под шаром
            let bgGrad = ctx.createRadialGradient(-5, -28, 4, 0, -20, 26);
            bgGrad.addColorStop(0, '#ffffff');
            bgGrad.addColorStop(0.5, currentBalloon);
            bgGrad.addColorStop(1, adjustColor(currentBalloon, -40));

            ctx.beginPath();
            ctx.arc(0, -22, 24, 0, Math.PI * 2);
            ctx.fillStyle = bgGrad;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#222';
            ctx.stroke();

            // Блик на шаре
            ctx.beginPath();
            ctx.ellipse(-8, -32, 6, 12, Math.PI / 4, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
            ctx.fill();

            // Узел шарика
            ctx.beginPath();
            ctx.moveTo(-4, 2); ctx.lineTo(4, 2); ctx.lineTo(0, -3);
            ctx.closePath();
            ctx.fillStyle = adjustColor(currentBalloon, -30);
            ctx.fill();

            // Веревочка
            ctx.beginPath();
            ctx.moveTo(0, 2);
            ctx.quadraticCurveTo(5, 10, 0, 18);
            ctx.strokeStyle = "#555";
            ctx.lineWidth = 1.5;
            ctx.stroke();
        } else {
            ctx.rotate(this.rotation);
        }

        // 2. Тело хомяка (Детализированный градиент шерсти)
        let bodyGrad = ctx.createRadialGradient(-4, 25, 5, 0, 28, 16);
        bodyGrad.addColorStop(0, adjustColor(currentHamster, 20));
        bodyGrad.addColorStop(0.8, currentHamster);
        bodyGrad.addColorStop(1, adjustColor(currentHamster, -40));

        // Задняя лапка
        ctx.fillStyle = adjustColor(currentHamster, -30);
        ctx.beginPath(); ctx.ellipse(-12, 36, 6, 4, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(12, 36, 6, 4, 0, 0, Math.PI * 2); ctx.fill();

        // Основное туловище
        ctx.beginPath();
        ctx.ellipse(0, 28, 16, 14, 0, 0, Math.PI * 2);
        ctx.fillStyle = bodyGrad;
        ctx.fill();
        ctx.strokeStyle = "#2c2c2c"; ctx.lineWidth = 1.8; ctx.stroke();

        // Белый животик
        let bellyGrad = ctx.createLinearGradient(0, 20, 0, 38);
        bellyGrad.addColorStop(0, "#ffffff");
        bellyGrad.addColorStop(1, "#fff0db");
        ctx.beginPath();
        ctx.ellipse(0, 30, 10, 8, 0, 0, Math.PI * 2);
        ctx.fillStyle = bellyGrad; ctx.fill();

        // Ушки
        ctx.fillStyle = currentHamster;
        ctx.beginPath(); ctx.arc(-11, 16, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(11, 16, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        
        ctx.fillStyle = "#ffbfa3";
        ctx.beginPath(); ctx.arc(-11, 16, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(11, 16, 2.5, 0, Math.PI * 2); ctx.fill();

        // Передние лапки
        ctx.fillStyle = "#fff0db";
        ctx.beginPath(); ctx.ellipse(-6, 32, 3.5, 2.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(6, 32, 3.5, 2.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

        // Щечки
        ctx.fillStyle = "rgba(255, 120, 150, 0.4)";
        ctx.beginPath(); ctx.arc(-11, 27, 4.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(11, 27, 4.5, 0, Math.PI * 2); ctx.fill();

        // Глазки
        if (this.isPopped) {
            ctx.strokeStyle = "#111"; ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(-7, 21); ctx.lineTo(-3, 25); ctx.moveTo(-3, 21); ctx.lineTo(-7, 25);
            ctx.moveTo(3, 21); ctx.lineTo(7, 25); ctx.moveTo(7, 21); ctx.lineTo(3, 25);
            ctx.stroke();
        } else {
            ctx.fillStyle = "#111";
            ctx.beginPath(); ctx.arc(-5, 23, 2.5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(5, 23, 2.5, 0, Math.PI * 2); ctx.fill();
            // Блики в глазах
            ctx.fillStyle = "#fff";
            ctx.beginPath(); ctx.arc(-6, 22, 0.8, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(4, 22, 0.8, 0, Math.PI * 2); ctx.fill();
        }

        // Носик и ротик
        ctx.fillStyle = "#ff4777";
        ctx.beginPath(); ctx.arc(0, 26, 1.8, 0, Math.PI * 2); ctx.fill();

        // Эффекты усиления
        if (shieldTime > 0 && !this.isPopped) {
            ctx.beginPath();
            ctx.arc(0, 5, 42, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(52, 152, 219, 0.25)"; ctx.fill();
            ctx.strokeStyle = "#3498db"; ctx.lineWidth = 3; ctx.stroke();
            ctx.beginPath();
            ctx.arc(0, 5, 46, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(52, 152, 219, 0.4)"; ctx.lineWidth = 1.5; ctx.stroke();
        }

        if (boostTime > 0 && !this.isPopped) {
            ctx.beginPath();
            ctx.arc(0, 5, 44, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(241, 196, 15, 0.25)"; ctx.fill();
            ctx.strokeStyle = "#f1c40f"; ctx.lineWidth = 3; ctx.stroke();
        }

        ctx.restore();
    },

    update(dt) {
        if (boostTime > 0) {
            this.velocity = (240 - this.y) * 7;
        } else {
            this.velocity += this.gravity * dt;
        }

        this.y += this.velocity * dt;

        if (this.isPopped) this.rotation += 10 * dt;

        if (this.y + 35 >= canvas.height - 40) {
            this.y = canvas.height - 40 - 35;
            if (gameState === "DYING") finishGameOver();
        }

        if (this.y - 40 <= 0 && gameState === "PLAYING" && shieldTime <= 0 && boostTime <= 0) {
            triggerPop();
        }
    },

    jump() {
        if (!this.isPopped && boostTime <= 0) this.velocity = this.jumpForce;
    },

    reset() {
        this.y = 250;
        this.velocity = 0;
        this.rotation = 0;
        this.isPopped = false;
    }
};

// Вспомогательная функция для осветления/темнения цвета
function adjustColor(hex, lum) {
    hex = String(hex).replace(/[^0-9a-f]/gi, '');
    if (hex.length < 6) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
    let rgb = "#", c, i;
    for (i = 0; i < 3; i++) {
        c = parseInt(hex.substr(i*2,2), 16);
        c = Math.round(Math.min(Math.max(0, c + (c * (lum / 100))), 255)).toString(16);
        rgb += ("00"+c).substr(c.length);
    }
    return rgb;
}

// Детализированные кактусы
function drawCactusHD(x, y, w, h, isTop) {
    let rx = x | 0;
    let ry = y | 0;

    ctx.save();
    
    // Градиент тела кактуса
    let grad = ctx.createLinearGradient(rx, 0, rx + w, 0);
    grad.addColorStop(0, '#1e5128');
    grad.addColorStop(0.3, '#4e9f3d');
    grad.addColorStop(0.7, '#2e7d32');
    grad.addColorStop(1, '#1b4332');

    ctx.fillStyle = grad;
    ctx.fillRect(rx, ry, w, h);

    // Закругленный наконечник кактуса
    ctx.beginPath();
    let capY = isTop ? ry + h : ry;
    ctx.ellipse(rx + w / 2, capY, w / 2, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    // Ребра и текстура
    ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(rx + 12, ry); ctx.lineTo(rx + 12, ry + h);
    ctx.moveTo(rx + 27, ry); ctx.lineTo(rx + 27, ry + h);
    ctx.moveTo(rx + 42, ry); ctx.lineTo(rx + 42, ry + h);
    ctx.stroke();

    // Иголки
    ctx.strokeStyle = "#d8f3dc";
    ctx.lineWidth = 1.5;
    for (let i = 15; i < h - 15; i += 24) {
        let cy = ry + i;
        ctx.beginPath();
        ctx.moveTo(rx, cy); ctx.lineTo(rx - 5, cy - 3);
        ctx.moveTo(rx + w, cy); ctx.lineTo(rx + w + 5, cy - 3);
        ctx.stroke();
    }

    // Внешняя обводка
    ctx.strokeStyle = "#0d2818";
    ctx.lineWidth = 2;
    ctx.strokeRect(rx, ry, w, h);

    ctx.restore();
}

function spawnObstacle() {
    let obs = obstaclePool.find(o => !o.active);
    if (!obs) return;

    obs.x = canvas.width;
    obs.gap = 145;
    obs.topHeight = (Math.random() * (canvas.height - obs.gap - 160) + 50) | 0;
    obs.bottomY = obs.topHeight + obs.gap;
    obs.width = 54;
    obs.passed = false;
    obs.active = true;

    let rand = Math.random();
    if (rand < 0.06) {
        spawnPowerup(obs.x + 27, obs.topHeight + obs.gap / 2, 'BOOST');
    } else if (rand < 0.22) {
        spawnPowerup(obs.x + 27, obs.topHeight + obs.gap / 2, 'SHIELD');
    } else if (rand < 0.75) {
        spawnSeed(obs.x + 27, obs.topHeight + obs.gap / 2);
    }
}

function spawnSeed(x, y) {
    let s = seedPool.find(item => !item.active);
    if (s) {
        s.x = x; s.y = y; s.rotation = Math.random() * Math.PI; s.active = true;
    }
}

function spawnPowerup(x, y, type) {
    let p = powerupPool.find(item => !item.active);
    if (p) {
        p.x = x; p.y = y; p.type = type; p.active = true;
    }
}

function updateUI() {
    const val = seedsData.toString();
    document.querySelectorAll(".seeds-val").forEach(el => el.textContent = val);
    localStorage.setItem("hamster_seeds", seedsData);
    localStorage.setItem("hamster_highscore", highScore);
    localStorage.setItem("hamster_skins", JSON.stringify(ownedSkins));
    localStorage.setItem("hamster_cur_balloon", currentBalloon);
    localStorage.setItem("hamster_cur_hamster", currentHamster);
}

function startGame() {
    document.getElementById("main-menu").classList.add("hidden");
    document.getElementById("shop-menu").classList.add("hidden");
    resetGame();
}

function openShop() {
    renderShop();
    document.getElementById("main-menu").classList.add("hidden");
    document.getElementById("shop-menu").classList.remove("hidden");
}

function closeShop() {
    document.getElementById("shop-menu").classList.add("hidden");
    document.getElementById("main-menu").classList.remove("hidden");
}

function renderShop() {
    updateUI();
    const bShop = document.getElementById("balloon-shop");
    const hShop = document.getElementById("hamster-shop");
    bShop.innerHTML = "";
    hShop.innerHTML = "";

    BALLOON_COLORS.forEach(item => {
        const bought = ownedSkins.balloon.includes(item.color);
        const active = currentBalloon === item.color;
        const div = document.createElement("div");
        div.className = `shop-item ${active ? 'active' : ''} ${bought ? 'bought' : ''}`;
        div.innerHTML = `
            <div class="item-preview" style="background:${item.color}"></div>
            <div>${item.name}</div>
            <div style="margin-top:4px; color:${active ? '#2ecc71' : '#fff'}">${active ? 'Надет' : bought ? 'Выбрать' : item.price + ' 🌻'}</div>
        `;
        div.onclick = () => buySkin('balloon', item);
        bShop.appendChild(div);
    });

    HAMSTER_COLORS.forEach(item => {
        const bought = ownedSkins.hamster.includes(item.color);
        const active = currentHamster === item.color;
        const div = document.createElement("div");
        div.className = `shop-item ${active ? 'active' : ''} ${bought ? 'bought' : ''}`;
        div.innerHTML = `
            <div class="item-preview" style="background:${item.color}"></div>
            <div>${item.name}</div>
            <div style="margin-top:4px; color:${active ? '#2ecc71' : '#fff'}">${active ? 'Надет' : bought ? 'Выбрать' : item.price + ' 🌻'}</div>
        `;
        div.onclick = () => buySkin('hamster', item);
        hShop.appendChild(div);
    });
}

function buySkin(type, item) {
    if (ownedSkins[type].includes(item.color)) {
        if (type === 'balloon') currentBalloon = item.color;
        if (type === 'hamster') currentHamster = item.color;
    } else if (seedsData >= item.price) {
        seedsData -= item.price;
        ownedSkins[type].push(item.color);
        if (type === 'balloon') currentBalloon = item.color;
        if (type === 'hamster') currentHamster = item.color;
    }
    renderShop();
}

function triggerPop() {
    if (gameState === "PLAYING") {
        gameState = "DYING";
        hamster.isPopped = true;
        hamster.velocity = -240;
        
        for (let i = 0; i < PARTICLE_POOL_SIZE; i++) {
            particlesPool[i] = {
                x: hamster.x, y: hamster.y - 20, size: Math.random() * 5 + 3,
                vx: (Math.random() - 0.5) * 450, vy: (Math.random() - 0.5) * 450,
                alpha: 1, active: true
            };
        }
    }
}

function finishGameOver() {
    gameState = "GAMEOVER";
    if (score > highScore) highScore = score;
    seedsData += seedsInGame;
    updateUI();
}

function checkCollision(obs) {
    if (shieldTime > 0 || boostTime > 0) return false;
    if (hamster.x + hamster.radius > obs.x && hamster.x - hamster.radius < obs.x + obs.width) {
        if (hamster.y - 30 < obs.topHeight || hamster.y + 35 > obs.bottomY) return true;
    }
    return false;
}

function resetGame() {
    hamster.reset();
    obstaclePool.forEach(o => o.active = false);
    seedPool.forEach(s => s.active = false);
    powerupPool.forEach(p => p.active = false);
    particlesPool.forEach(p => p.active = false);
    
    score = 0;
    seedsInGame = 0;
    spawnTimer = 0;
    shieldTime = 0;
    boostTime = 0;
    gameSpeed = 160;
    gameState = "PLAYING";
}

let lastTime = performance.now();

// Главный цикл рендеринга
function loop(now) {
    let dt = (now - lastTime) / 1000;
    if (dt > 0.1) dt = 0.1;
    lastTime = now;

    if (gameState === "PLAYING") {
        if (shieldTime > 0) shieldTime -= dt;
        if (boostTime > 0) {
            boostTime -= dt;
            gameSpeed = 400;
        } else {
            gameSpeed = 160;
        }

        spawnTimer += dt;
        let spawnInterval = boostTime > 0 ? 0.55 : 1.5;
        if (spawnTimer >= spawnInterval) {
            spawnTimer = 0;
            spawnObstacle();
        }
    }

    // Детализированный Фон Спальни
    let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    bgGrad.addColorStop(0, '#f9eae1');
    bgGrad.addColorStop(0.7, '#f7d6c1');
    bgGrad.addColorStop(1, '#e3a882');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Обойные узоры
    ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
    for (let x = 0; x < canvas.width; x += 40) {
        ctx.fillRect(x, 0, 2, canvas.height - 40);
    }

    // Окно спальни с закругленными углами
    ctx.save();
    ctx.fillStyle = "#a8dadc";
    ctx.fillRect(230, 70, 120, 140);
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 6;
    ctx.strokeRect(230, 70, 120, 140);
    // Рама окна
    ctx.beginPath();
    ctx.moveTo(290, 70); ctx.lineTo(290, 210);
    ctx.moveTo(230, 140); ctx.lineTo(350, 140);
    ctx.stroke();
    // Облачко
    ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
    ctx.beginPath(); ctx.arc(260, 110, 14, 0, Math.PI * 2); ctx.arc(275, 105, 18, 0, Math.PI * 2); ctx.arc(295, 110, 14, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // Деревянный пол
    let floorGrad = ctx.createLinearGradient(0, canvas.height - 40, 0, canvas.height);
    floorGrad.addColorStop(0, '#8d5b4c');
    floorGrad.addColorStop(1, '#5c3a2f');
    ctx.fillStyle = floorGrad;
    ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
    ctx.fillStyle = '#4a2c22';
    ctx.fillRect(0, canvas.height - 40, canvas.width, 4);

    if (gameState === "PLAYING" || gameState === "DYING" || gameState === "GAMEOVER") {
        hamster.update(dt);

        // Препятствия
        for (let i = 0; i < OBSTACLE_POOL_SIZE; i++) {
            let obs = obstaclePool[i];
            if (!obs.active) continue;

            if (gameState === "PLAYING") {
                obs.x -= gameSpeed * dt;
                if (!obs.passed && obs.x + obs.width < hamster.x) {
                    score++;
                    obs.passed = true;
                }
                if (checkCollision(obs)) triggerPop();
                if (obs.x + obs.width < 0) obs.active = false;
            }

            drawCactusHD(obs.x, 0, obs.width, obs.topHeight, true);
            drawCactusHD(obs.x, obs.bottomY, obs.width, canvas.height - obs.bottomY - 40, false);
        }

        // Семечки
        for (let i = 0; i < SEED_POOL_SIZE; i++) {
            let s = seedPool[i];
            if (!s.active) continue;

            if (gameState === "PLAYING") {
                s.x -= gameSpeed * dt;
                let dist = Math.hypot(hamster.x - s.x, hamster.y - s.y);
                if (dist < hamster.radius + s.radius) {
                    s.active = false;
                    seedsInGame += 5;
                }
                if (s.x < -20) s.active = false;
            }

            if (s.active) {
                ctx.save();
                ctx.translate(s.x | 0, s.y | 0);
                ctx.rotate(s.rotation);
                
                // Детализированная семечка
                let seedGrad = ctx.createLinearGradient(-6, -10, 6, 10);
                seedGrad.addColorStop(0, '#4a3222');
                seedGrad.addColorStop(0.5, '#2b1a10');
                seedGrad.addColorStop(1, '#150d08');

                ctx.beginPath();
                ctx.ellipse(0, 0, 7, 12, 0, 0, Math.PI * 2);
                ctx.fillStyle = seedGrad; ctx.fill();
                ctx.strokeStyle = "#f4c430"; ctx.lineWidth = 1.5; ctx.stroke();

                // Полоска на семечке
                ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(0, 9); ctx.stroke();

                ctx.restore();
            }
        }

        // Бонусы
        for (let i = 0; i < POWERUP_POOL_SIZE; i++) {
            let p = powerupPool[i];
            if (!p.active) continue;

            if (gameState === "PLAYING") {
                p.x -= gameSpeed * dt;
                let dist = Math.hypot(hamster.x - p.x, hamster.y - p.y);
                if (dist < hamster.radius + p.radius) {
                    p.active = false;
                    if (p.type === 'SHIELD') shieldTime = 5.0;
                    else if (p.type === 'BOOST') boostTime = 5.0;
                }
                if (p.x < -20) p.active = false;
            }

            if (p.active) {
                ctx.save();
                ctx.translate(p.x | 0, p.y | 0);
                
                let pGrad = ctx.createRadialGradient(-3, -3, 2, 0, 0, p.radius);
                if (p.type === 'SHIELD') {
                    pGrad.addColorStop(0, '#5dede7'); pGrad.addColorStop(1, '#0077b6');
                } else {
                    pGrad.addColorStop(0, '#fff07c'); pGrad.addColorStop(1, '#f77f00');
                }

                ctx.beginPath(); ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = pGrad; ctx.fill();
                ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();

                ctx.fillStyle = "#fff"; ctx.font = "bold 15px sans-serif";
                ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(p.type === 'SHIELD' ? "🛡️" : "⚡", 0, 1);
                ctx.restore();
            }
        }

        // Частицы лопнувшего шара
        for (let i = 0; i < PARTICLE_POOL_SIZE; i++) {
            let p = particlesPool[i];
            if (!p.active) continue;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy += 450 * dt;
            p.alpha -= 0.85 * dt;

            if (p.alpha <= 0) {
                p.active = false;
            } else {
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = currentBalloon;
                ctx.beginPath(); ctx.arc(p.x | 0, p.y | 0, p.size, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }
        }
    }

    if (gameState !== "MENU") hamster.draw();
    drawUI();

    requestAnimationFrame(loop);
}

// Детализированный интерфейс
function drawUI() {
    if (gameState === "PLAYING" || gameState === "DYING") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
        ctx.roundRect(12, 12, 110, 55, 10);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.font = "800 18px 'Segoe UI', sans-serif";
        ctx.textAlign = "left";
        ctx.fillText(`Счёт: ${score}`, 22, 35);

        ctx.font = "bold 12px 'Segoe UI', sans-serif";
        ctx.fillStyle = "#ffbfa3";
        ctx.fillText(`Рекорд: ${highScore}`, 22, 55);

        ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
        ctx.roundRect(270, 12, 118, 36, 10);
        ctx.fill();

        ctx.textAlign = "right";
        ctx.font = "bold 16px 'Segoe UI', sans-serif";
        ctx.fillStyle = "#ffd700";
        ctx.fillText(`🌻 ${seedsData + seedsInGame}`, 376, 36);

        // Индикаторы таймеров бонусов
        let barY = 20;
        if (shieldTime > 0) {
            ctx.fillStyle = "rgba(52, 152, 219, 0.8)";
            ctx.fillRect(132, barY, (shieldTime / 5.0) * 130, 8);
            ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1; ctx.strokeRect(132, barY, 130, 8);
            barY += 14;
        }
        if (boostTime > 0) {
            ctx.fillStyle = "rgba(241, 196, 15, 0.8)";
            ctx.fillRect(132, barY, (boostTime / 5.0) * 130, 8);
            ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1; ctx.strokeRect(132, barY, 130, 8);
        }

    } else if (gameState === "GAMEOVER") {
        ctx.textAlign = "center";
        
        // Окно проигрыша
        ctx.fillStyle = "rgba(25, 20, 35, 0.92)";
        ctx.roundRect(40, 150, 320, 260, 16);
        ctx.fill();
        ctx.strokeStyle = "#ff5e7e"; ctx.lineWidth = 2; ctx.stroke();

        ctx.fillStyle = "#ff5e7e";
        ctx.font = "800 28px sans-serif";
        ctx.fillText("ЛОПНУЛ!", canvas.width / 2, 195);

        ctx.fillStyle = "#ffffff";
        ctx.font = "18px sans-serif";
        ctx.fillText(`Очки: ${score}`, canvas.width / 2, 240);
        ctx.fillText(`Собрано: +${seedsInGame} 🌻`, canvas.width / 2, 275);
        ctx.fillText(`Рекорд: ${highScore}`, canvas.width / 2, 310);

        ctx.font = "14px sans-serif";
        ctx.fillStyle = "#aaa";
        ctx.fillText("Кликните для выхода в меню", canvas.width / 2, 370);
        ctx.textAlign = "left";
    }
}

// Полифилл для roundRect если браузер старый
if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        this.beginPath();
        this.moveTo(x + r, y);
        this.arcTo(x + w, y, x + w, y + h, r);
        this.arcTo(x + w, y + h, x, y + h, r);
        this.arcTo(x, y + h, x, y, r);
        this.arcTo(x, y, x + w, y, r);
        this.closePath();
        return this;
    };
}

function handleInput() {
    if (gameState === "PLAYING") hamster.jump();
    else if (gameState === "GAMEOVER") {
        gameState = "MENU";
        document.getElementById("main-menu").classList.remove("hidden");
    }
}

window.addEventListener("keydown", (e) => {
    if (e.code === "Space") handleInput();
});

canvas.addEventListener("click", handleInput);

updateUI();
requestAnimationFrame(loop);
</script>
