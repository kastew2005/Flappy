<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Happy Pig</title>
  <style>
    * {
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    canvas {
      border: 4px solid #fff;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      cursor: pointer;
      max-width: 100vw;
      max-height: 100vh;
    }
  </style>
</head>
<body>

<canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- WEB AUDIO API ---
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } else if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

const sound = {
  jump() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(350, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
  },
  score() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.25);
  },
  hit() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
  },
  buy() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
  },
  powerup() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.2);
  }
};

// --- СОСТОЯНИЕ ИГРЫ ---
let state = {
  current: 0,
  getReady: 0,
  game: 1,
  gameOver: 2,
  store: 3
};

let frames = 0;
let score = 0;
let gameSpeed = 2;
let highScore = parseInt(localStorage.getItem('pig_highscore')) || 0;
let coins = parseInt(localStorage.getItem('pig_coins')) || 0;
let equippedSkin = localStorage.getItem('pig_equippedSkin') || 'default';
let ownedSkins = JSON.parse(localStorage.getItem('pig_ownedSkins')) || ['default'];

// --- БОНУСЫ (POWER-UPS) ---
let shieldActive = false;
let magnetTimer = 0;

// --- СКИНИ ДЛЯ СВИНЬИ ---
const skins = [
  { id: 'default', name: 'Обычная свинья', price: 0, bodyColor: '#FFB6C1', snoutColor: '#FF69B4' },
  { id: 'muddy', name: 'Свинья в грязи', price: 10, bodyColor: '#FFB6C1', snoutColor: '#FF69B4', isMuddy: true },
  { id: 'black', name: 'Черная свинья', price: 20, bodyColor: '#333333', snoutColor: '#555555' },
  { id: 'gold', name: 'Золотая свинья', price: 50, bodyColor: '#FFD700', snoutColor: '#FFA500' }
];

// Координаты кнопок
const shopBtn = { x: 130, y: 380, w: 140, h: 45 };
const backBtn = { x: 130, y: 530, w: 140, h: 40 };

function handleInput(clientX, clientY) {
  initAudio();
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const clickX = (clientX - rect.left) * scaleX;
  const clickY = (clientY - rect.top) * scaleY;

  if (state.current === state.store) {
    if (clickX >= backBtn.x && clickX <= backBtn.x + backBtn.w &&
        clickY >= backBtn.y && clickY <= backBtn.y + backBtn.h) {
      state.current = state.getReady;
      return;
    }

    skins.forEach((s, i) => {
      const itemY = 140 + i * 90;
      const btnX = 260, btnY = itemY + 20, btnW = 100, btnH = 35;
      
      if (clickX >= btnX && clickX <= btnX + btnW && clickY >= btnY && clickY <= btnY + btnH) {
        if (ownedSkins.includes(s.id)) {
          equippedSkin = s.id;
          localStorage.setItem('pig_equippedSkin', equippedSkin);
          sound.buy();
        } else if (coins >= s.price) {
          coins -= s.price;
          ownedSkins.push(s.id);
          equippedSkin = s.id;
          localStorage.setItem('pig_coins', coins);
          localStorage.setItem('pig_ownedSkins', JSON.stringify(ownedSkins));
          localStorage.setItem('pig_equippedSkin', equippedSkin);
          sound.buy();
        }
      }
    });
    return;
  }

  if (state.current === state.getReady) {
    if (clickX >= shopBtn.x && clickX <= shopBtn.x + shopBtn.w &&
        clickY >= shopBtn.y && clickY <= shopBtn.y + shopBtn.h) {
      state.current = state.store;
      return;
    }
  }

  switch (state.current) {
    case state.getReady:
      state.current = state.game;
      pig.flap();
      break;
    case state.game:
      pig.flap();
      break;
    case state.gameOver:
      pipes.reset();
      powerups.reset();
      collectibles.reset();
      pig.reset();
      score = 0;
      gameSpeed = 2;
      shieldActive = false;
      magnetTimer = 0;
      state.current = state.getReady;
      break;
  }
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    if (state.current !== state.store) handleInput(0, 0);
  }
});
canvas.addEventListener('click', (e) => handleInput(e.clientX, e.clientY));
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  handleInput(touch.clientX, touch.clientY);
}, { passive: false });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

// Облака
const clouds = {
  items: [
    { x: 40, y: 80, speed: 0.4, size: 0.8 },
    { x: 200, y: 140, speed: 0.6, size: 1.2 },
    { x: 320, y: 60, speed: 0.3, size: 0.9 }
  ],
  update() {
    this.items.forEach(c => {
      c.x -= c.speed;
      if (c.x < -100) c.x = canvas.width + 50;
    });
  },
  draw() {
    ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
    this.items.forEach(c => {
      ctx.beginPath();
      ctx.arc(c.x, c.y, 20 * c.size, 0, Math.PI * 2);
      ctx.arc(c.x + 15 * c.size, c.y - 10 * c.size, 15 * c.size, 0, Math.PI * 2);
      ctx.arc(c.x + 30 * c.size, c.y, 18 * c.size, 0, Math.PI * 2);
      ctx.fill();
    });
  }
};

// Земля
const ground = {
  x: 0,
  h: 80,
  update() {
    if (state.current === state.game) {
      this.x = (this.x - gameSpeed) % 20;
    }
  },
  draw() {
    const y = canvas.height - this.h;
    ctx.fillStyle = '#DED895';
    ctx.fillRect(0, y, canvas.width, this.h);
    ctx.fillStyle = '#73C838';
    ctx.fillRect(0, y, canvas.width, 16);
    ctx.fillStyle = '#559E27';
    for (let i = this.x; i < canvas.width + 20; i += 20) {
      ctx.beginPath();
      ctx.moveTo(i, y + 16);
      ctx.lineTo(i - 10, y);
      ctx.lineTo(i - 4, y);
      ctx.lineTo(i + 6, y + 16);
      ctx.fill();
    }
  }
};

// Свинья (Персонаж)
const pig = {
  x: 80,
  y: 250,
  r: 15,
  gravity: 0.25,
  jump: 4.6,
  velocity: 0,
  rotation: 0,

  flap() {
    this.velocity = -this.jump;
    sound.jump();
  },

  reset() {
    this.y = 250;
    this.velocity = 0;
    this.rotation = 0;
  },

  update() {
    if (state.current === state.getReady || state.current === state.store) {
      this.y = 250 + Math.sin(frames / 10) * 6;
      this.rotation = 0;
    } else {
      this.velocity += this.gravity;
      this.y += this.velocity;

      if (this.y + this.r >= canvas.height - ground.h) {
        this.y = canvas.height - ground.h - this.r;
        if (shieldActive) {
          shieldActive = false;
          this.velocity = -this.jump;
          sound.hit();
        } else {
          if (state.current === state.game) sound.hit();
          state.current = state.gameOver;
        }
      }

      if (this.velocity < 0) {
        this.rotation = -0.3;
      } else {
        this.rotation += 0.04;
        if (this.rotation > 1.1) this.rotation = 1.1;
      }
    }

    if (magnetTimer > 0) magnetTimer--;
  },

  draw(customX, customY, customSkinId) {
    const x = customX !== undefined ? customX : this.x;
    const y = customY !== undefined ? customY : this.y;
    const skinId = customSkinId !== undefined ? customSkinId : equippedSkin;
    const skinData = skins.find(s => s.id === skinId) || skins[0];

    ctx.save();
    ctx.translate(x, y);
    if (customX === undefined) ctx.rotate(this.rotation);

    // Ушки
    ctx.fillStyle = skinData.snoutColor;
    ctx.beginPath();
    ctx.ellipse(-8, -12, 6, 4, -0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(4, -13, 6, 4, 0.4, 0, Math.PI * 2);
    ctx.fill();

    // Тело
    ctx.fillStyle = skinData.bodyColor;
    ctx.beginPath();
    ctx.arc(0, 0, this.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Грязь для скина "Свинья в грязи"
    if (skinData.isMuddy) {
      ctx.fillStyle = '#654321';
      ctx.beginPath();
      ctx.arc(-6, -4, 4, 0, Math.PI * 2);
      ctx.arc(4, 6, 5, 0, Math.PI * 2);
      ctx.fill();
    }

    // Глаза
    ctx.fillStyle = '#FFF';
    ctx.beginPath();
    ctx.arc(4, -5, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(5, -5, 2, 0, Math.PI * 2);
    ctx.fill();

    // Пятачок
    ctx.fillStyle = skinData.snoutColor;
    ctx.beginPath();
    ctx.ellipse(9, 2, 6, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Дырки в пятачке
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(7, 2, 1.2, 0, Math.PI * 2);
    ctx.arc(11, 2, 1.2, 0, Math.PI * 2);
    ctx.fill();

    // Хвостик крючком
    ctx.strokeStyle = skinData.snoutColor;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(-16, 2, 4, 0, Math.PI);
    ctx.stroke();

    // Эффект Щита
    if (customX === undefined && shieldActive) {
      ctx.strokeStyle = 'rgba(52, 152, 219, 0.8)';
      ctx.fillStyle = 'rgba(52, 152, 219, 0.25)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, this.r + 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }

    ctx.restore();
  }
};

// Спавн монеток
const collectibles = {
  items: [],
  reset() { this.items = []; },
  spawn(x, y) {
    this.items.push({ x: x, y: y, r: 10, collected: false });
  },
  update() {
    if (state.current !== state.game) return;
    this.items.forEach((item, index) => {
      item.x -= gameSpeed;

      // Логика Магнита
      if (magnetTimer > 0 && !item.collected) {
        const dx = pig.x - item.x;
        const dy = pig.y - item.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 160) {
          item.x += (dx / dist) * 7;
          item.y += (dy / dist) * 7;
        }
      }

      // Подбор монеты
      const distToPig = Math.hypot(pig.x - item.x, pig.y - item.y);
      if (distToPig < pig.r + item.r && !item.collected) {
        item.collected = true;
        coins++;
        localStorage.setItem('pig_coins', coins);
        sound.score();
      }

      if (item.x + item.r < 0 || item.collected) {
        this.items.splice(index, 1);
      }
    });
  },
  draw() {
    this.items.forEach(item => {
      ctx.fillStyle = '#F1C40F';
      ctx.beginPath();
      ctx.arc(item.x, item.y, item.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#D4AC0D';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#B7950B';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('$', item.x, item.y + 4);
    });
  }
};

// Спавн Бонусов
const powerups = {
  items: [],
  reset() { this.items = []; },
  spawn(x, y) {
    const type = Math.random() < 0.5 ? 'shield' : 'magnet';
    this.items.push({ x: x, y: y, r: 14, type: type });
  },
  update() {
    if (state.current !== state.game) return;
    this.items.forEach((p, index) => {
      p.x -= gameSpeed;

      const dist = Math.hypot(pig.x - p.x, pig.y - p.y);
      if (dist < pig.r + p.r) {
        if (p.type === 'shield') {
          shieldActive = true;
        } else if (p.type === 'magnet') {
          magnetTimer = 480; // ~8 секунд при 60 FPS
        }
        sound.powerup();
        this.items.splice(index, 1);
        return;
      }

      if (p.x + p.r < 0) {
        this.items.splice(index, 1);
      }
    });
  },
  draw() {
    this.items.forEach(p => {
      ctx.save();
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.type === 'shield' ? '#3498DB' : '#E74C3C';
      ctx.fill();
      ctx.strokeStyle = '#FFF';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#FFF';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(p.type === 'shield' ? '🛡️' : '🧲', p.x, p.y + 4);
      ctx.restore();
    });
  }
};

// Трубы
const pipes = {
  items: [],
  gap: 120,
  w: 52,

  reset() {
    this.items = [];
  },

  update() {
    if (state.current !== state.game) return;

    gameSpeed = 2 + Math.floor(score / 10) * 0.4;
    const spawnInterval = Math.max(70, Math.floor(120 - (gameSpeed - 2) * 15));

    if (frames % spawnInterval === 0) {
      const minY = 80;
      const maxY = canvas.height - ground.h - this.gap - 80;
      const topY = -Math.floor(Math.random() * (maxY - minY + 1) + minY);

      const pipeX = canvas.width;
      const gapCenterY = topY + 400 + this.gap / 2;

      // Спавн бонусов или монеток внутри прохода
      const rand = Math.random();
      if (rand < 0.25) {
        powerups.spawn(pipeX + this.w / 2, gapCenterY);
      } else if (rand < 0.75) {
        collectibles.spawn(pipeX + this.w / 2, gapCenterY);
      }

      this.items.push({
        x: pipeX,
        top: topY,
        passed: false
      });
    }

    this.items.forEach((p, index) => {
      p.x -= gameSpeed;

      const bottomY = p.top + 400 + this.gap;

      // Проверка столкновения
      if ((pig.x + pig.r > p.x && pig.x - pig.r < p.x + this.w && pig.y - pig.r < p.top + 400) ||
          (pig.x + pig.r > p.x && pig.x - pig.r < p.x + this.w && pig.y + pig.r > bottomY)) {
        if (shieldActive) {
          shieldActive = false;
          sound.hit();
          p.x = -100; // Разрушаем трубу
        } else {
          sound.hit();
          state.current = state.gameOver;
        }
      }

      if (p.x + this.w < pig.x && !p.passed) {
        score++;
        sound.score();
        p.passed = true;
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('pig_highscore', highScore);
        }
      }

      if (p.x + this.w < 0) {
        this.items.splice(index, 1);
      }
    });
  },

  drawPipe(x, y, isTop) {
    const h = 400;
    let grad = ctx.createLinearGradient(x, 0, x + this.w, 0);
    grad.addColorStop(0, '#73C838');
    grad.addColorStop(0.3, '#B5E61D');
    grad.addColorStop(0.7, '#73C838');
    grad.addColorStop(1, '#559E27');

    ctx.fillStyle = grad;
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;

    ctx.fillRect(x, y, this.w, h);
    ctx.strokeRect(x, y, this.w, h);

    const capH = 24;
    const capW = this.w + 6;
    const capX = x - 3;
    const capY = isTop ? y + h - capH : y;

    ctx.fillRect(capX, capY, capW, capH);
    ctx.strokeRect(capX, capY, capW, capH);
  },

  draw() {
    this.items.forEach(p => {
      this.drawPipe(p.x, p.top, true);
      this.drawPipe(p.x, p.top + 400 + this.gap, false);
    });
  }
};

// Отрисовка монеты в углу
function drawTopRightCoins() {
  const x = canvas.width - 30;
  const y = 25;
  ctx.fillStyle = '#F1C40F';
  ctx.beginPath();
  ctx.arc(x - 45, y, 9, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#D4AC0D';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#B7950B';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('$', x - 45, y + 4);

  ctx.fillStyle = '#FFF';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 3;
  ctx.font = 'bold 18px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(coins, x, y + 6);
  ctx.strokeText(coins, x, y + 6);
}

// Отрисовка активных бонусов
function drawActivePowerups() {
  let offset = 20;

  if (shieldActive) {
    ctx.fillStyle = '#3498DB';
    ctx.beginPath();
    ctx.arc(offset, 25, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#FFF';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🛡️', offset, 29);
    offset += 32;
  }

  if (magnetTimer > 0) {
    const secondsLeft = Math.ceil(magnetTimer / 60);
    ctx.fillStyle = '#E74C3C';
    ctx.beginPath();
    ctx.arc(offset, 25, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#FFF';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`${secondsLeft}s`, offset, 29);
  }
}

// Отрисовка магазина
function drawStore() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#FFF';
  ctx.font = 'bold 26px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('СКИНИ СВИНЬИ', canvas.width / 2, 50);

  drawTopRightCoins();

  skins.forEach((s, i) => {
    const itemY = 140 + i * 90;

    ctx.fillStyle = '#2C3E50';
    ctx.fillRect(20, itemY, 360, 75);
    ctx.strokeStyle = '#34495E';
    ctx.lineWidth = 2;
    ctx.strokeRect(20, itemY, 360, 75);

    pig.draw(60, itemY + 38, s.id);

    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 15px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(s.name, 100, itemY + 43);

    const btnX = 260, btnY = itemY + 20, btnW = 100, btnH = 35;
    const isOwned = ownedSkins.includes(s.id);
    const isEquipped = equippedSkin === s.id;

    if (isEquipped) {
      ctx.fillStyle = '#27AE60';
      ctx.fillRect(btnX, btnY, btnW, btnH);
      ctx.fillStyle = '#FFF';
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('НАДЕТО', btnX + btnW / 2, btnY + 22);
    } else if (isOwned) {
      ctx.fillStyle = '#2980B9';
      ctx.fillRect(btnX, btnY, btnW, btnH);
      ctx.fillStyle = '#FFF';
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('НАДЕТЬ', btnX + btnW / 2, btnY + 22);
    } else {
      ctx.fillStyle = coins >= s.price ? '#E67E22' : '#7F8C8D';
      ctx.fillRect(btnX, btnY, btnW, btnH);
      ctx.fillStyle = '#FFF';
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`${s.price} монет`, btnX + btnW / 2, btnY + 22);
    }
  });

  ctx.fillStyle = '#E74C3C';
  ctx.fillRect(backBtn.x, backBtn.y, backBtn.w, backBtn.h);
  ctx.fillStyle = '#FFF';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('НАЗАД', backBtn.x + backBtn.w / 2, backBtn.y + 26);
}

function drawUI() {
  ctx.fillStyle = '#FFF';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 3;

  if (state.current === state.game) {
    ctx.font = 'bold 36px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(score, canvas.width / 2, 50);
    ctx.strokeText(score, canvas.width / 2, 50);

    drawTopRightCoins();
    drawActivePowerups();

    if (score >= 10) {
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText(`Скорость: x${(gameSpeed / 2).toFixed(1)}`, canvas.width / 2, 75);
    }
  } else if (state.current === state.getReady) {
    ctx.font = 'bold 32px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('HAPPY PIG', canvas.width / 2, 120);
    ctx.strokeText('HAPPY PIG', canvas.width / 2, 120);

    ctx.font = 'bold 20px sans-serif';
    ctx.fillText('ТАПНИТЕ ДЛЯ СТАРТА', canvas.width / 2, 180);

    ctx.fillStyle = '#F39C12';
    ctx.font = 'bold 22px sans-serif';
    ctx.fillText(`РЕКОРД: ${highScore}`, canvas.width / 2, 280);
    ctx.strokeText(`РЕКОРД: ${highScore}`, canvas.width / 2, 280);

    drawTopRightCoins();

    ctx.fillStyle = '#E67E22';
    ctx.fillRect(shopBtn.x, shopBtn.y, shopBtn.w, shopBtn.h);
    ctx.strokeStyle = '#000';
    ctx.strokeRect(shopBtn.x, shopBtn.y, shopBtn.w, shopBtn.h);
    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('МАГАЗИН', shopBtn.x + shopBtn.w / 2, shopBtn.y + 28);
  } else if (state.current === state.gameOver) {
    ctx.fillStyle = '#DECE9C';
    ctx.fillRect(60, 160, 280, 180);
    ctx.strokeRect(60, 160, 280, 180);

    ctx.fillStyle = '#E74C3C';
    ctx.font = 'bold 28px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width / 2, 200);

    ctx.fillStyle = '#000';
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`Счет: ${score}`, 90, 240);
    ctx.fillText(`Рекорд: ${highScore}`, 90, 270);
    ctx.fillText(`Монеты: ${coins}`, 90, 300);

    ctx.textAlign = 'center';
    ctx.font = '14px sans-serif';
    ctx.fillText('Тапните для перезапуска', canvas.width / 2, 325);
  } else if (state.current === state.store) {
    drawStore();
  }
}

function loop() {
  ctx.fillStyle = '#70C5CE';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  clouds.update();
  clouds.draw();

  pipes.update();
  pipes.draw();

  collectibles.update();
  collectibles.draw();

  powerups.update();
  powerups.draw();

  ground.update();
  ground.draw();

  pig.update();
  pig.draw();

  drawUI();

  frames++;
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
