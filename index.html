<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bounce Hamster</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #222;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    #gameContainer {
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border-radius: 12px;
      overflow: hidden;
    }

    canvas {
      display: block;
      background: #87CEEB;
    }

    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 2;
    }

    .hud-text {
      font-size: 20px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
    }

    button {
      pointer-events: auto;
      background: #ff9800;
      border: none;
      color: white;
      padding: 10px 24px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 0 #b56c00;
      transition: all 0.1s ease;
    }

    button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #b56c00;
    }

    /* Обновленное меню с анимированным градиентным фоном */
    #overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, rgba(26, 35, 126, 0.85), rgba(74, 20, 140, 0.85), rgba(183, 28, 28, 0.85));
      background-size: 400% 400%;
      animation: gradientBG 10s ease infinite;
      backdrop-filter: blur(5px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Фоновый декор для меню (летающие семечки) */
    .bg-decor {
      position: absolute;
      font-size: 30px;
      opacity: 0.25;
      user-select: none;
      pointer-events: none;
      animation: floatSlow 6s ease-in-out infinite alternate;
    }

    @keyframes floatSlow {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-20px) rotate(15deg); }
    }

    #overlay h1 {
      margin: 0 0 10px 0;
      font-size: 48px;
      color: #ffeb3b;
      text-shadow: 0 4px 10px rgba(0,0,0,0.5), 0 0 20px rgba(255, 235, 59, 0.4);
      letter-spacing: 1px;
    }

    #overlay p {
      font-size: 18px;
      margin-bottom: 25px;
      color: #e0e0e0;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

<div id="gameContainer">
  <canvas id="gameCanvas" width="800" height="400"></canvas>
  
  <div id="ui">
    <div class="hud-text">Счет: <span id="scoreText">0</span> | Семечки: 🌻<span id="seedsText">0</span></div>
    <button id="soundBtn" onclick="toggleSound()">🔊 Звук: Вкл</button>
  </div>

  <div id="overlay">
    <!-- Декоративные иконки на фоне меню -->
    <span class="bg-decor" style="top: 10%; left: 15%; animation-delay: 0s;">🌻</span>
    <span class="bg-decor" style="top: 70%; left: 10%; animation-delay: 1s;">🐹</span>
    <span class="bg-decor" style="top: 20%; right: 15%; animation-delay: 2s;">🛡️</span>
    <span class="bg-decor" style="top: 75%; right: 12%; animation-delay: 3s;">🌻</span>

    <h1 id="overlayTitle">Bounce Hamster</h1>
    <p id="overlaySub">Нажмите "Пробел" или кликните мышкой для прыжка</p>
    <button id="startBtn" onclick="startGame()">Играть!</button>
  </div>
</div>

<script>
// ==========================================
// 🔊 МОДУЛЬ ЗВУКОВЫХ ЭФФЕКТОВ (Web Audio API)
// ==========================================
const SoundFX = {
  ctx: null,
  muted: false,

  init() {
    if (!this.ctx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioContext();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  },

  playJump() {
    if (this.muted) return;
    this.init();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(160, now);
    osc.frequency.exponentialRampToValueAtTime(480, now + 0.15);

    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.15);
  },

  playPickup() {
    if (this.muted) return;
    this.init();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(1318.51, now);
    osc.frequency.setValueAtTime(1975.53, now + 0.08);

    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.25);
  },

  playPowerup() {
    if (this.muted) return;
    this.init();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.linearRampToValueAtTime(600, now + 0.1);
    osc.frequency.linearRampToValueAtTime(900, now + 0.2);

    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.3);
  },

  playHit() {
    if (this.muted) return;
    this.init();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.35);

    gain.gain.setValueAtTime(0.4, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.35);
  },

  toggleMute() {
    this.muted = !this.muted;
    return this.muted;
  }
};

// ==========================================
// 🎮 ЛОГИКА ИГРЫ
// ==========================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const scoreText = document.getElementById('scoreText');
const seedsText = document.getElementById('seedsText');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlaySub = document.getElementById('overlaySub');
const soundBtn = document.getElementById('soundBtn');

let isPlaying = false;
let score = 0;
let seedsCollected = 0;
let gameSpeed = 5;
let frameCount = 0;

const groundY = 320;

const hamster = {
  x: 100,
  y: groundY - 25,
  radius: 25,
  vy: 0,
  gravity: 0.65,
  jumpPower: -13,
  isGrounded: true,
  hasShield: false,

  jump() {
    if (this.isGrounded) {
      this.vy = this.jumpPower;
      this.isGrounded = false;
      SoundFX.playJump();
    }
  },

  update() {
    this.vy += this.gravity;
    this.y += this.vy;

    if (this.y >= groundY - this.radius) {
      this.y = groundY - this.radius;
      this.vy = 0;
      this.isGrounded = true;
    }
  },

  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = this.hasShield ? '#00e5ff' : 'rgba(255, 255, 255, 0.8)';
    ctx.stroke();

    if (this.hasShield) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius + 6, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(0, 229, 255, 0.5)';
      ctx.lineWidth = 4;
      ctx.stroke();
    }

    ctx.font = '30px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🐹', this.x, this.y);
  }
};

let obstacles = [];
let items = [];

function spawnObstacle() {
  const height = Math.random() * 30 + 30;
  obstacles.push({
    x: canvas.width,
    y: groundY - height,
    width: 25,
    height: height
  });
}

function spawnItem() {
  const isPowerup = Math.random() < 0.2;
  items.push({
    x: canvas.width,
    y: groundY - 60 - Math.random() * 80,
    radius: 12,
    type: isPowerup ? 'shield' : 'seed'
  });
}

function startGame() {
  SoundFX.init();
  isPlaying = true;
  score = 0;
  seedsCollected = 0;
  gameSpeed = 5;
  obstacles = [];
  items = [];
  hamster.hasShield = false;
  hamster.y = groundY - hamster.radius;
  overlay.style.display = 'none';
  gameLoop();
}

function gameOver() {
  isPlaying = false;
  SoundFX.playHit();
  overlayTitle.innerText = "Игра Окончена!";
  overlaySub.innerText = `Вы набрали: ${Math.floor(score)} очков и 🌻 ${seedsCollected}`;
  overlay.style.display = 'flex';
}

function toggleSound() {
  const muted = SoundFX.toggleMute();
  soundBtn.innerText = muted ? '🔇 Звук: Выкл' : '🔊 Звук: Вкл';
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    if (isPlaying) hamster.jump();
  }
});

canvas.addEventListener('mousedown', () => {
  if (isPlaying) hamster.jump();
});

function gameLoop() {
  if (!isPlaying) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#8B5A2B';
  ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
  ctx.fillStyle = '#4CAF50';
  ctx.fillRect(0, groundY, canvas.width, 10);

  frameCount++;
  if (frameCount % 100 === 0) spawnObstacle();
  if (frameCount % 130 === 0) spawnItem();

  hamster.update();
  hamster.draw();

  for (let i = obstacles.length - 1; i >= 0; i--) {
    let obs = obstacles[i];
    obs.x -= gameSpeed;

    ctx.fillStyle = '#2e7d32';
    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

    if (
      hamster.x + hamster.radius > obs.x &&
      hamster.x - hamster.radius < obs.x + obs.width &&
      hamster.y + hamster.radius > obs.y
    ) {
      if (hamster.hasShield) {
        hamster.hasShield = false;
        obstacles.splice(i, 1);
        SoundFX.playPowerup();
        continue;
      } else {
        gameOver();
        return;
      }
    }

    if (obs.x + obs.width < 0) obstacles.splice(i, 1);
  }

  for (let i = items.length - 1; i >= 0; i--) {
    let item = items[i];
    item.x -= gameSpeed;

    ctx.font = '20px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(item.type === 'seed' ? '🌻' : '🛡️', item.x, item.y);

    let dist = Math.hypot(hamster.x - item.x, hamster.y - item.y);
    if (dist < hamster.radius + item.radius) {
      if (item.type === 'seed') {
        seedsCollected++;
        score += 20;
        SoundFX.playPickup();
      } else {
        hamster.hasShield = true;
        SoundFX.playPowerup();
      }
      items.splice(i, 1);
      continue;
    }

    if (item.x + item.radius < 0) items.splice(i, 1);
  }

  score += 0.1;
  gameSpeed += 0.0005;
  scoreText.innerText = Math.floor(score);
  seedsText.innerText = seedsCollected;

  requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
