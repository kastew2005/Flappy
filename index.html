<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хомяк на воздушном шарике</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 12px;
            overflow: hidden;
        }
        canvas {
            display: block;
            background: #f4e8d1;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Состояние игры
let gameState = "START"; // START, PLAYING, DYING, GAMEOVER
let score = 0;
let highScore = 0;
let frames = 0;

// Осколки от лопнувшего шарика
let balloonPopParticles = [];

// Хомяк на шарике
const hamster = {
    x: 80,
    y: 250,
    radius: 20,
    gravity: 0.35,
    jumpForce: -6.5,
    velocity: 0,
    rotation: 0,
    isPopped: false,
    
    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        // 1. Воздушный шар (рисуем только если он НЕ лопнул)
        if (!this.isPopped) {
            ctx.beginPath();
            ctx.arc(0, -20, 22, 0, Math.PI * 2);
            ctx.fillStyle = "#ff5e7e";
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#d63456";
            ctx.stroke();

            // Блик на шарике
            ctx.beginPath();
            ctx.arc(-7, -27, 5, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
            ctx.fill();

            // Узел шарика
            ctx.beginPath();
            ctx.moveTo(-3, 2);
            ctx.lineTo(3, 2);
            ctx.lineTo(0, 5);
            ctx.closePath();
            ctx.fillStyle = "#d63456";
            ctx.fill();

            // Ниточка
            ctx.beginPath();
            ctx.moveTo(0, 5);
            ctx.lineTo(0, 15);
            ctx.strokeStyle = "#888";
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        // 2. Тело хомяка
        ctx.beginPath();
        ctx.ellipse(0, 25, 14, 12, 0, 0, Math.PI * 2);
        ctx.fillStyle = "#d49b4b";
        ctx.fill();
        ctx.strokeStyle = "#a36e24";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Животик
        ctx.beginPath();
        ctx.ellipse(0, 27, 8, 7, 0, 0, Math.PI * 2);
        ctx.fillStyle = "#fff0db";
        ctx.fill();

        // Ушки
        ctx.beginPath();
        ctx.arc(-10, 16, 4, 0, Math.PI * 2);
        ctx.arc(10, 16, 4, 0, Math.PI * 2);
        ctx.fillStyle = "#a36e24";
        ctx.fill();

        // Щечки
        ctx.beginPath();
        ctx.arc(-11, 25, 6, 0, Math.PI * 2);
        ctx.arc(11, 25, 6, 0, Math.PI * 2);
        ctx.fillStyle = "#ffbfa3";
        ctx.fill();

        // Глаза (если лопнул — глазки крестиками)
        if (this.isPopped) {
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 2;
            // Левый глаз Х
            ctx.beginPath();
            ctx.moveTo(-7, 20); ctx.lineTo(-3, 24);
            ctx.moveTo(-3, 20); ctx.lineTo(-7, 24);
            ctx.stroke();
            // Правый глаз Х
            ctx.beginPath();
            ctx.moveTo(3, 20); ctx.lineTo(7, 24);
            ctx.moveTo(7, 20); ctx.lineTo(3, 24);
            ctx.stroke();
        } else {
            ctx.beginPath();
            ctx.arc(-5, 22, 2, 0, Math.PI * 2);
            ctx.arc(5, 22, 2, 0, Math.PI * 2);
            ctx.fillStyle = "#000";
            ctx.fill();
        }

        // Носик
        ctx.beginPath();
        ctx.arc(0, 25, 1.5, 0, Math.PI * 2);
        ctx.fillStyle = "#ff5e7e";
        ctx.fill();

        ctx.restore();
    },

    update() {
        this.velocity += this.gravity;
        this.y += this.velocity;

        // Во время падения вращаем хомяка
        if (this.isPopped) {
            this.rotation += 0.15;
        }

        // Касание пола
        if (this.y + 35 >= canvas.height - 40) {
            this.y = canvas.height - 40 - 35;
            if (gameState === "DYING") {
                finishGameOver();
            }
        }

        // Вылет за верхнюю границу
        if (this.y - 40 <= 0 && gameState === "PLAYING") {
            triggerPop();
        }
    },

    jump() {
        if (!this.isPopped) {
            this.velocity = this.jumpForce;
        }
    },

    reset() {
        this.y = 250;
        this.velocity = 0;
        this.rotation = 0;
        this.isPopped = false;
    }
};

// Класс для частиц лопнувшего шарика
class PopParticle {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 6 + 4;
        this.vx = (Math.random() - 0.5) * 12;
        this.vy = (Math.random() - 0.5) * 12;
        this.gravity = 0.2;
        this.color = Math.random() > 0.3 ? "#ff5e7e" : "#ffbfa3";
        this.alpha = 1;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.alpha -= 0.02;
    }

    draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

// Запуск эффекта лопания
function triggerPop() {
    if (gameState === "PLAYING") {
        gameState = "DYING";
        hamster.isPopped = true;
        hamster.velocity = -4; // Небольшой подскок перед падением

        // Создаем кусочки шара на месте верхнего центра
        const popX = hamster.x;
        const popY = hamster.y - 20;
        for (let i = 0; i < 20; i++) {
            balloonPopParticles.push(new PopParticle(popX, popY));
        }
    }
}

// Завершение анимации смерти
function finishGameOver() {
    gameState = "GAMEOVER";
    if (score > highScore) {
        highScore = score;
    }
}

// Препятствия
const obstacles = [];
const obstacleTypes = ['CAT_PAW', 'CACTUS', 'NEEDLE'];

class Obstacle {
    constructor() {
        this.x = canvas.width;
        this.gap = 140;
        this.topHeight = Math.floor(Math.random() * (canvas.height - this.gap - 160)) + 50;
        this.bottomY = this.topHeight + this.gap;
        this.width = 50;
        this.passed = false;
        
        this.topType = obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];
        this.bottomType = obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];
    }

    draw() {
        this.drawSingle(this.topType, this.x, 0, this.width, this.topHeight, true);
        this.drawSingle(this.bottomType, this.x, this.bottomY, this.width, canvas.height - this.bottomY - 40, false);
    }

    drawSingle(type, x, y, w, h, isTop) {
        ctx.save();
        if (type === 'NEEDLE') {
            ctx.fillStyle = "#b5b5b5";
            ctx.fillRect(x + w/2 - 4, y, 8, h);
            ctx.beginPath();
            if (isTop) {
                ctx.moveTo(x + w/2 - 6, y + h - 15);
                ctx.lineTo(x + w/2 + 6, y + h - 15);
                ctx.lineTo(x + w/2, y + h);
            } else {
                ctx.moveTo(x + w/2 - 6, y + 15);
                ctx.lineTo(x + w/2 + 6, y + 15);
                ctx.lineTo(x + w/2, y);
            }
            ctx.fillStyle = "#e0e0e0";
            ctx.fill();
            
            ctx.strokeStyle = "#777";
            ctx.lineWidth = 2;
            let eyeY = isTop ? y + 15 : y + h - 15;
            ctx.strokeRect(x + w/2 - 2, eyeY, 4, 10);

        } else if (type === 'CACTUS') {
            ctx.fillStyle = "#47a047";
            ctx.fillRect(x + 10, y, w - 20, h);

            ctx.strokeStyle = "#2d662d";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x + 18, y); ctx.lineTo(x + 18, y + h);
            ctx.moveTo(x + 32, y); ctx.lineTo(x + 32, y + h);
            ctx.stroke();

            ctx.strokeStyle = "#1b3e1b";
            ctx.lineWidth = 1;
            for (let i = 10; i < h - 10; i += 20) {
                let currentY = y + i;
                ctx.beginPath();
                ctx.moveTo(x + 10, currentY); ctx.lineTo(x + 4, currentY - 4);
                ctx.moveTo(x + 40, currentY); ctx.lineTo(x + 46, currentY - 4);
                ctx.stroke();
            }

        } else if (type === 'CAT_PAW') {
            ctx.fillStyle = "#ff9d42";
            ctx.fillRect(x + 8, y, w - 16, h);
            
            ctx.fillStyle = "#d66f11";
            for(let i = 15; i < h - 20; i += 30) {
                ctx.fillRect(x + 8, y + i, w - 16, 6);
            }

            let endY = isTop ? y + h : y;
            ctx.fillStyle = "#ff9d42";
            ctx.beginPath();
            ctx.arc(x + w/2, endY, 20, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#ffbfa3";
            ctx.beginPath();
            ctx.arc(x + w/2, endY + (isTop ? -4 : 4), 8, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    update() {
        if (gameState === "PLAYING") {
            this.x -= 2.5;
        }
    }
}

// Отрисовка фона
function drawBackground() {
    ctx.fillStyle = "#fceade";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "#f7d6c1";
    ctx.lineWidth = 2;
    for (let i = 0; i < canvas.width; i += 30) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();
    }

    ctx.fillStyle = "#87ceeb";
    ctx.fillRect(250, 80, 100, 120);
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 6;
    ctx.strokeRect(250, 80, 100, 120);
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(280, 130, 12, 0, Math.PI*2);
    ctx.arc(295, 125, 16, 0, Math.PI*2);
    ctx.arc(310, 130, 12, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "#8d5b4c";
    ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
    ctx.fillStyle = "#6d4134";
    ctx.fillRect(0, canvas.height - 40, canvas.width, 5);
}

// Проверка коллизий
function checkCollision(obs) {
    if (hamster.x + hamster.radius > obs.x && hamster.x - hamster.radius < obs.x + obs.width) {
        if (hamster.y - 30 < obs.topHeight || hamster.y + 35 > obs.bottomY) {
            return true;
        }
    }
    return false;
}

function resetGame() {
    hamster.reset();
    obstacles.length = 0;
    balloonPopParticles = [];
    score = 0;
    frames = 0;
    gameState = "PLAYING";
}

// Игровой цикл
function loop() {
    drawBackground();

    if (gameState === "PLAYING" || gameState === "DYING" || gameState === "GAMEOVER") {
        hamster.update();

        if (gameState === "PLAYING") {
            if (frames % 100 === 0) {
                obstacles.push(new Obstacle());
            }
            frames++;
        }

        // Отрисовка и обновление препятствий
        for (let i = obstacles.length - 1; i >= 0; i--) {
            obstacles[i].update();
            obstacles[i].draw();

            if (gameState === "PLAYING") {
                if (!obstacles[i].passed && obstacles[i].x + obstacles[i].width < hamster.x) {
                    score++;
                    obstacles[i].passed = true;
                }

                if (checkCollision(obstacles[i])) {
                    triggerPop();
                }
            }

            if (obstacles[i].x + obstacles[i].width < 0) {
                obstacles.splice(i, 1);
            }
        }

        // Обновление частиц лопнувшего шара
        for (let i = balloonPopParticles.length - 1; i >= 0; i--) {
            balloonPopParticles[i].update();
            balloonPopParticles[i].draw();
            if (balloonPopParticles[i].alpha <= 0) {
                balloonPopParticles.splice(i, 1);
            }
        }
    }

    hamster.draw();
    drawUI();

    requestAnimationFrame(loop);
}

// Отрисовка интерфейса
function drawUI() {
    ctx.fillStyle = "#4a3525";
    ctx.font = "bold 22px 'Segoe UI', sans-serif";

    if (gameState === "PLAYING" || gameState === "DYING") {
        ctx.fillText(`Счет: ${score}`, 20, 40);
    } else if (gameState === "START") {
        ctx.textAlign = "center";
        ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
        ctx.fillRect(30, 200, 340, 180);
        
        ctx.fillStyle = "#d63456";
        ctx.font = "bold 24px sans-serif";
        ctx.fillText("Хомяк на шарике!", canvas.width / 2, 240);
        
        ctx.fillStyle = "#333";
        ctx.font = "16px sans-serif";
        ctx.fillText("Кликай или жми Пробел,", canvas.width / 2, 280);
        ctx.fillText("чтобы лететь вверх", canvas.width / 2, 305);
        ctx.fillText("Нажмите для старта", canvas.width / 2, 350);
        ctx.textAlign = "left";
    } else if (gameState === "GAMEOVER") {
        ctx.textAlign = "center";
        ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        ctx.fillRect(40, 180, 320, 200);

        ctx.fillStyle = "#d63456";
        ctx.font = "bold 28px sans-serif";
        ctx.fillText("БOОМ! ЛОПНУЛ!", canvas.width / 2, 230);

        ctx.fillStyle = "#333";
        ctx.font = "18px sans-serif";
        ctx.fillText(`Счет: ${score}`, canvas.width / 2, 270);
        ctx.fillText(`Рекорд: ${highScore}`, canvas.width / 2, 300);

        ctx.font = "14px sans-serif";
        ctx.fillStyle = "#666";
        ctx.fillText("Кликните для перезапуска", canvas.width / 2, 350);
        ctx.textAlign = "left";
    }
}

function handleInput() {
    if (gameState === "START") {
        gameState = "PLAYING";
    } else if (gameState === "PLAYING") {
        hamster.jump();
    } else if (gameState === "GAMEOVER") {
        resetGame();
    }
}

window.addEventListener("keydown", (e) => {
    if (e.code === "Space") {
        handleInput();
    }
});

canvas.addEventListener("click", () => {
    handleInput();
});

loop();
</script>

</body>
</html>
