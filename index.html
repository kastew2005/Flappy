<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хомяк на шарике — High Performance</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 12px;
            overflow: hidden;
            width: 400px;
            height: 600px;
            background: #fceade;
            background-image: repeating-linear-gradient(90deg, transparent, transparent 28px, #f7d6c1 28px, #f7d6c1 30px);
        }
        #game-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: #8d5b4c;
            border-top: 5px solid #6d4134;
            pointer-events: none;
        }
        canvas {
            display: block;
            transform: translateZ(0);
            will-change: transform;
        }
        .ui-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(253, 245, 235, 0.95);
            z-index: 10;
        }
        .hidden { display: none !important; }
        h1 { color: #d63456; font-size: 28px; margin-bottom: 20px; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        h2 { color: #4a3525; font-size: 20px; margin: 15px 0 10px 0; }
        
        .btn {
            background: #ff5e7e;
            color: white;
            border: none;
            padding: 12px 30px;
            margin: 8px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(214, 52, 86, 0.3);
            transition: transform 0.1s;
            width: 200px;
            text-align: center;
        }
        .btn:hover { background: #d63456; transform: translateY(-2px); }
        .btn:active { transform: translateY(0); }
        
        .seeds-counter {
            position: absolute;
            top: 15px;
            right: 15px;
            font-weight: bold;
            font-size: 16px;
            color: #4a3525;
            background: #fff0db;
            padding: 5px 12px;
            border-radius: 15px;
            border: 2px solid #d49b4b;
        }

        .shop-section { width: 90%; max-height: 400px; overflow-y: auto; text-align: center; }
        .shop-grid { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .shop-item {
            background: white;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 8px;
            width: 90px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .shop-item.active { border-color: #47a047; background: #eafaf0; }
        .shop-item.bought { border-color: #ff5e7e; }
        .item-preview { width: 30px; height: 30px; border-radius: 50%; margin: 5px auto; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    
    <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="main-menu" class="ui-screen">
        <h1>Хомяк на шарике</h1>
        <div class="seeds-counter">🌻 <span class="seeds-val">0</span></div>
        <button class="btn" onclick="startGame()">Играть</button>
        <button class="btn" style="background: #47a047;" onclick="openShop()">Магазин</button>
    </div>

    <!-- МАГАЗИН -->
    <div id="shop-menu" class="ui-screen hidden">
        <h1>Магазин</h1>
        <div class="seeds-counter">🌻 <span class="seeds-val">0</span></div>
        
        <div class="shop-section">
            <h2>Цвет шарика (15 🌻)</h2>
            <div class="shop-grid" id="balloon-shop"></div>

            <h2>Цвет хомяка (20 🌻)</h2>
            <div class="shop-grid" id="hamster-shop"></div>
        </div>

        <button class="btn" style="margin-top: 20px;" onclick="closeShop()">Назад</button>
    </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d", { alpha: false }); // Отключение альфы холста для ускорения рендеринга

// Сохранения & Данные
let seedsData = parseInt(localStorage.getItem("hamster_seeds")) || 0;
let highScore = parseInt(localStorage.getItem("hamster_highscore")) || 0;
let ownedSkins = JSON.parse(localStorage.getItem("hamster_skins")) || {
    balloon: ["#ff5e7e"],
    hamster: ["#d49b4b"]
};
let currentBalloon = localStorage.getItem("hamster_cur_balloon") || "#ff5e7e";
let currentHamster = localStorage.getItem("hamster_cur_hamster") || "#d49b4b";

const BALLOON_COLORS = [
    { name: "Розовый", color: "#ff5e7e", price: 0 },
    { name: "Зеленый", color: "#47a047", price: 15 },
    { name: "Синий", color: "#3498db", price: 15 }
];

const HAMSTER_COLORS = [
    { name: "Рыжий", color: "#d49b4b", price: 0 },
    { name: "Черный", color: "#333333", price: 20 },
    { name: "Серый", color: "#888888", price: 20 },
    { name: "Белый", color: "#e6e6e6", price: 20 }
];

let gameState = "MENU";
let score = 0;
let seedsInGame = 0;
let gameSpeed = 150; // Скорость в пикселях в секунду (для Delta Time)
let spawnTimer = 0;

let shieldTime = 0;
let boostTime = 0;

// OBJECT POOLS (Для исключения работы Сборщика Мусора)
const OBSTACLE_POOL_SIZE = 10;
const SEED_POOL_SIZE = 10;
const POWERUP_POOL_SIZE = 5;
const PARTICLE_POOL_SIZE = 25;

const obstaclePool = Array.from({ length: OBSTACLE_POOL_SIZE }, () => ({
    x: 0, topHeight: 0, bottomY: 0, width: 50, gap: 140, active: false, passed: false
}));

const seedPool = Array.from({ length: SEED_POOL_SIZE }, () => ({
    x: 0, y: 0, radius: 12, active: false
}));

const powerupPool = Array.from({ length: POWERUP_POOL_SIZE }, () => ({
    x: 0, y: 0, radius: 16, type: 'SHIELD', active: false
}));

const particlesPool = Array.from({ length: PARTICLE_POOL_SIZE }, () => ({
    x: 0, y: 0, size: 0, vx: 0, vy: 0, alpha: 0, active: false
}));

// Хомяк
const hamster = {
    x: 80,
    y: 250,
    radius: 20,
    gravity: 1200,      // Адаптировано под секунды
    jumpForce: -360,     // Адаптировано под секунды
    velocity: 0,
    rotation: 0,
    isPopped: false,

    draw() {
        let hx = this.x | 0;
        let hy = this.y | 0;

        ctx.save();
        ctx.translate(hx, hy);

        // 1. Шарик
        if (!this.isPopped) {
            ctx.beginPath();
            ctx.arc(0, -20, 22, 0, Math.PI * 2);
            ctx.fillStyle = currentBalloon;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#333";
            ctx.stroke();

            // Блик
            ctx.beginPath();
            ctx.arc(-7, -27, 5, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
            ctx.fill();

            // Нить
            ctx.beginPath();
            ctx.moveTo(0, 2); ctx.lineTo(0, 15);
            ctx.strokeStyle = "#777"; ctx.lineWidth = 1.5; ctx.stroke();
        } else {
            ctx.rotate(this.rotation);
        }

        // 2. Тело хомяка
        ctx.beginPath();
        ctx.ellipse(0, 25, 14, 12, 0, 0, Math.PI * 2);
        ctx.fillStyle = currentHamster; ctx.fill();
        ctx.strokeStyle = "#222"; ctx.lineWidth = 1.5; ctx.stroke();

        ctx.beginPath();
        ctx.ellipse(0, 27, 8, 7, 0, 0, Math.PI * 2);
        ctx.fillStyle = "#fff0db"; ctx.fill();

        // Ушки
        ctx.fillStyle = currentHamster;
        ctx.beginPath(); ctx.arc(-10, 16, 4, 0, Math.PI * 2); ctx.arc(10, 16, 4, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#222"; ctx.stroke();

        // Щечки
        ctx.fillStyle = "#ffbfa3";
        ctx.beginPath(); ctx.arc(-11, 25, 5, 0, Math.PI * 2); ctx.arc(11, 25, 5, 0, Math.PI * 2); ctx.fill();

        // Глаза
        if (this.isPopped) {
            ctx.strokeStyle = "#000"; ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-7, 20); ctx.lineTo(-3, 24); ctx.moveTo(-3, 20); ctx.lineTo(-7, 24);
            ctx.moveTo(3, 20); ctx.lineTo(7, 24); ctx.moveTo(7, 20); ctx.lineTo(3, 24);
            ctx.stroke();
        } else {
            ctx.fillStyle = "#000";
            ctx.beginPath(); ctx.arc(-5, 22, 2, 0, Math.PI * 2); ctx.arc(5, 22, 2, 0, Math.PI * 2); ctx.fill();
        }

        // Носик
        ctx.fillStyle = "#ff5e7e";
        ctx.beginPath(); ctx.arc(0, 25, 1.5, 0, Math.PI * 2); ctx.fill();

        // Аура Щита
        if (shieldTime > 0 && !this.isPopped) {
            ctx.beginPath();
            ctx.arc(0, 5, 38, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(52, 152, 219, 0.3)"; ctx.fill();
            ctx.strokeStyle = "#3498db"; ctx.lineWidth = 3; ctx.stroke();
        }
        
        // Шлейф Ускорения
        if (boostTime > 0 && !this.isPopped) {
            ctx.beginPath();
            ctx.arc(0, 5, 42, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(241, 196, 15, 0.3)"; ctx.fill();
            ctx.strokeStyle = "#f1c40f"; ctx.lineWidth = 3; ctx.stroke();
        }

        ctx.restore();
    },

    update(dt) {
        if (boostTime > 0) {
            this.velocity = (250 - this.y) * 6;
        } else {
            this.velocity += this.gravity * dt;
        }

        this.y += this.velocity * dt;

        if (this.isPopped) this.rotation += 9 * dt;

        if (this.y + 35 >= canvas.height - 40) {
            this.y = canvas.height - 40 - 35;
            if (gameState === "DYING") finishGameOver();
        }

        if (this.y - 40 <= 0 && gameState === "PLAYING" && shieldTime <= 0 && boostTime <= 0) {
            triggerPop();
        }
    },

    jump() {
        if (!this.isPopped && boostTime <= 0) this.velocity = this.jumpForce;
    },

    reset() {
        this.y = 250;
        this.velocity = 0;
        this.rotation = 0;
        this.isPopped = false;
    }
};

// Функция отрисовки кактуса
function drawCactus(x, y, w, h) {
    let rx = x | 0;
    let ry = y | 0;

    ctx.save();
    ctx.fillStyle = "#47a047";
    ctx.fillRect(rx + 10, ry, w - 20, h);

    ctx.strokeStyle = "#2d662d";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(rx + 18, ry); ctx.lineTo(rx + 18, ry + h);
    ctx.moveTo(rx + 32, ry); ctx.lineTo(rx + 32, ry + h);
    ctx.stroke();

    ctx.strokeStyle = "#1b3e1b";
    ctx.lineWidth = 1;
    for (let i = 10; i < h - 10; i += 20) {
        let cy = ry + i;
        ctx.beginPath();
        ctx.moveTo(rx + 10, cy); ctx.lineTo(rx + 4, cy - 4);
        ctx.moveTo(rx + 40, cy); ctx.lineTo(rx + 46, cy - 4);
        ctx.stroke();
    }
    ctx.restore();
}

// Управление спавном из пула
function spawnObstacle() {
    let obs = obstaclePool.find(o => !o.active);
    if (!obs) return;

    obs.x = canvas.width;
    obs.gap = 140;
    obs.topHeight = (Math.random() * (canvas.height - obs.gap - 160) + 50) | 0;
    obs.bottomY = obs.topHeight + obs.gap;
    obs.width = 50;
    obs.passed = false;
    obs.active = true;

    let rand = Math.random();
    if (rand < 0.05) {
        spawnPowerup(obs.x + 25, obs.topHeight + obs.gap / 2, 'BOOST');
    } else if (rand < 0.20) {
        spawnPowerup(obs.x + 25, obs.topHeight + obs.gap / 2, 'SHIELD');
    } else if (rand < 0.70) {
        spawnSeed(obs.x + 25, obs.topHeight + obs.gap / 2);
    }
}

function spawnSeed(x, y) {
    let s = seedPool.find(item => !item.active);
    if (s) {
        s.x = x; s.y = y; s.active = true;
    }
}

function spawnPowerup(x, y, type) {
    let p = powerupPool.find(item => !item.active);
    if (p) {
        p.x = x; p.y = y; p.type = type; p.active = true;
    }
}

// UI & Управление
function updateUI() {
    const val = seedsData.toString();
    document.querySelectorAll(".seeds-val").forEach(el => el.textContent = val);
    localStorage.setItem("hamster_seeds", seedsData);
    localStorage.setItem("hamster_highscore", highScore);
    localStorage.setItem("hamster_skins", JSON.stringify(ownedSkins));
    localStorage.setItem("hamster_cur_balloon", currentBalloon);
    localStorage.setItem("hamster_cur_hamster", currentHamster);
}

function startGame() {
    document.getElementById("main-menu").classList.add("hidden");
    document.getElementById("shop-menu").classList.add("hidden");
    resetGame();
}

function openShop() {
    renderShop();
    document.getElementById("main-menu").classList.add("hidden");
    document.getElementById("shop-menu").classList.remove("hidden");
}

function closeShop() {
    document.getElementById("shop-menu").classList.add("hidden");
    document.getElementById("main-menu").classList.remove("hidden");
}

function renderShop() {
    updateUI();
    const bShop = document.getElementById("balloon-shop");
    const hShop = document.getElementById("hamster-shop");
    bShop.innerHTML = "";
    hShop.innerHTML = "";

    BALLOON_COLORS.forEach(item => {
        const bought = ownedSkins.balloon.includes(item.color);
        const active = currentBalloon === item.color;
        const div = document.createElement("div");
        div.className = `shop-item ${active ? 'active' : ''} ${bought ? 'bought' : ''}`;
        div.innerHTML = `
            <div class="item-preview" style="background:${item.color}"></div>
            <div>${item.name}</div>
            <div>${active ? 'Надет' : bought ? 'Выбрать' : item.price + ' 🌻'}</div>
        `;
        div.onclick = () => buySkin('balloon', item);
        bShop.appendChild(div);
    });

    HAMSTER_COLORS.forEach(item => {
        const bought = ownedSkins.hamster.includes(item.color);
        const active = currentHamster === item.color;
        const div = document.createElement("div");
        div.className = `shop-item ${active ? 'active' : ''} ${bought ? 'bought' : ''}`;
        div.innerHTML = `
            <div class="item-preview" style="background:${item.color}"></div>
            <div>${item.name}</div>
            <div>${active ? 'Надет' : bought ? 'Выбрать' : item.price + ' 🌻'}</div>
        `;
        div.onclick = () => buySkin('hamster', item);
        hShop.appendChild(div);
    });
}

function buySkin(type, item) {
    if (ownedSkins[type].includes(item.color)) {
        if (type === 'balloon') currentBalloon = item.color;
        if (type === 'hamster') currentHamster = item.color;
    } else if (seedsData >= item.price) {
        seedsData -= item.price;
        ownedSkins[type].push(item.color);
        if (type === 'balloon') currentBalloon = item.color;
        if (type === 'hamster') currentHamster = item.color;
    }
    renderShop();
}

function triggerPop() {
    if (gameState === "PLAYING") {
        gameState = "DYING";
        hamster.isPopped = true;
        hamster.velocity = -240;
        
        for (let i = 0; i < 20; i++) {
            particlesPool[i] = {
                x: hamster.x, y: hamster.y - 20, size: Math.random() * 6 + 4,
                vx: (Math.random() - 0.5) * 400, vy: (Math.random() - 0.5) * 400,
                alpha: 1, active: true
            };
        }
    }
}

function finishGameOver() {
    gameState = "GAMEOVER";
    if (score > highScore) highScore = score;
    seedsData += seedsInGame;
    updateUI();
}

function checkCollision(obs) {
    if (shieldTime > 0 || boostTime > 0) return false;
    if (hamster.x + hamster.radius > obs.x && hamster.x - hamster.radius < obs.x + obs.width) {
        if (hamster.y - 30 < obs.topHeight || hamster.y + 35 > obs.bottomY) return true;
    }
    return false;
}

function resetGame() {
    hamster.reset();
    obstaclePool.forEach(o => o.active = false);
    seedPool.forEach(s => s.active = false);
    powerupPool.forEach(p => p.active = false);
    particlesPool.forEach(p => p.active = false);
    
    score = 0;
    seedsInGame = 0;
    spawnTimer = 0;
    shieldTime = 0;
    boostTime = 0;
    gameSpeed = 150;
    gameState = "PLAYING";
}

let lastTime = performance.now();

// ГЛАВНЫЙ ОПТИМИЗИРОВАННЫЙ ИГРОВОЙ ЦИКЛ
function loop(now) {
    let dt = (now - lastTime) / 1000;
    if (dt > 0.1) dt = 0.1; // Ограничение скачков при смене вкладок браузера
    lastTime = now;

    if (gameState === "PLAYING") {
        if (shieldTime > 0) shieldTime -= dt;
        if (boostTime > 0) {
            boostTime -= dt;
            gameSpeed = 380;
        } else {
            gameSpeed = 150;
        }

        spawnTimer += dt;
        let spawnInterval = boostTime > 0 ? 0.6 : 1.6;
        if (spawnTimer >= spawnInterval) {
            spawnTimer = 0;
            spawnObstacle();
        }
    }

    // Фон
    ctx.fillStyle = "#fceade";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Окно спальни
    ctx.fillStyle = "#87ceeb"; ctx.fillRect(250, 80, 100, 120);
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 6; ctx.strokeRect(250, 80, 100, 120);

    if (gameState === "PLAYING" || gameState === "DYING" || gameState === "GAMEOVER") {
        hamster.update(dt);

        // Обновление и отрисовка препятствий
        for (let i = 0; i < OBSTACLE_POOL_SIZE; i++) {
            let obs = obstaclePool[i];
            if (!obs.active) continue;

            if (gameState === "PLAYING") {
                obs.x -= gameSpeed * dt;
                if (!obs.passed && obs.x + obs.width < hamster.x) {
                    score++;
                    obs.passed = true;
                }
                if (checkCollision(obs)) triggerPop();
                if (obs.x + obs.width < 0) obs.active = false;
            }

            drawCactus(obs.x, 0, obs.width, obs.topHeight);
            drawCactus(obs.x, obs.bottomY, obs.width, canvas.height - obs.bottomY - 40);
        }

        // Обновление и отрисовка семечек
        for (let i = 0; i < SEED_POOL_SIZE; i++) {
            let s = seedPool[i];
            if (!s.active) continue;

            if (gameState === "PLAYING") {
                s.x -= gameSpeed * dt;
                let dist = Math.hypot(hamster.x - s.x, hamster.y - s.y);
                if (dist < hamster.radius + s.radius) {
                    s.active = false;
                    seedsInGame += 5;
                }
                if (s.x < -20) s.active = false;
            }

            if (s.active) {
                ctx.save();
                ctx.translate(s.x | 0, s.y | 0);
                ctx.beginPath();
                ctx.ellipse(0, 0, 6, 10, Math.PI / 4, 0, Math.PI * 2);
                ctx.fillStyle = "#3a2518"; ctx.fill();
                ctx.strokeStyle = "#f4c430"; ctx.lineWidth = 1.5; ctx.stroke();
                ctx.restore();
            }
        }

        // Обновление и отрисовка бонусов
        for (let i = 0; i < POWERUP_POOL_SIZE; i++) {
            let p = powerupPool[i];
            if (!p.active) continue;

            if (gameState === "PLAYING") {
                p.x -= gameSpeed * dt;
                let dist = Math.hypot(hamster.x - p.x, hamster.y - p.y);
                if (dist < hamster.radius + p.radius) {
                    p.active = false;
                    if (p.type === 'SHIELD') shieldTime = 5.0;
                    else if (p.type === 'BOOST') boostTime = 5.0;
                }
                if (p.x < -20) p.active = false;
            }

            if (p.active) {
                ctx.save();
                ctx.translate(p.x | 0, p.y | 0);
                ctx.beginPath();
                ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.type === 'SHIELD' ? "#3498db" : "#f1c40f";
                ctx.fill();
                ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
                ctx.fillStyle = "#fff"; ctx.font = "bold 14px sans-serif";
                ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(p.type === 'SHIELD' ? "🛡️" : "⚡", 0, 1);
                ctx.restore();
            }
        }

        // Частицы
        for (let i = 0; i < PARTICLE_POOL_SIZE; i++) {
            let p = particlesPool[i];
            if (!p.active) continue;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy += 400 * dt;
            p.alpha -= 0.8 * dt;

            if (p.alpha <= 0) {
                p.active = false;
            } else {
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = currentBalloon;
                ctx.beginPath(); ctx.arc(p.x | 0, p.y | 0, p.size, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }
        }
    }

    if (gameState !== "MENU") hamster.draw();
    drawUI();

    requestAnimationFrame(loop);
}

function drawUI() {
    if (gameState === "PLAYING" || gameState === "DYING") {
        ctx.fillStyle = "#4a3525";
        ctx.font = "bold 20px 'Segoe UI', sans-serif";
        ctx.textAlign = "left";
        ctx.fillText(`Счет: ${score}`, 20, 35);

        ctx.textAlign = "right";
        ctx.fillText(`🌻 ${seedsData + seedsInGame}`, 380, 35);
        
        ctx.font = "bold 14px 'Segoe UI', sans-serif";
        ctx.fillStyle = "#8d5b4c";
        ctx.fillText(`Рекорд 🏆: ${highScore}`, 380, 58);

        let barY = 20;
        if (shieldTime > 0) {
            ctx.fillStyle = "rgba(52, 152, 219, 0.8)";
            ctx.fillRect(130, barY, (shieldTime / 5.0) * 140, 8);
            barY += 12;
        }
        if (boostTime > 0) {
            ctx.fillStyle = "rgba(241, 196, 15, 0.8)";
            ctx.fillRect(130, barY, (boostTime / 5.0) * 140, 8);
        }

    } else if (gameState === "GAMEOVER") {
        ctx.textAlign = "center";
        ctx.fillStyle = "rgba(255, 255, 255, 0.95)";
        ctx.fillRect(40, 160, 320, 240);

        ctx.fillStyle = "#d63456";
        ctx.font = "bold 26px sans-serif";
        ctx.fillText("ЛОПНУЛ!", canvas.width / 2, 205);

        ctx.fillStyle = "#333";
        ctx.font = "18px sans-serif";
        ctx.fillText(`Очки: ${score}`, canvas.width / 2, 245);
        ctx.fillText(`Собрано: +${seedsInGame} 🌻`, canvas.width / 2, 280);
        ctx.fillText(`Рекорд: ${highScore}`, canvas.width / 2, 315);

        ctx.font = "14px sans-serif";
        ctx.fillStyle = "#666";
        ctx.fillText("Кликните для меню", canvas.width / 2, 365);
        ctx.textAlign = "left";
    }
}

function handleInput() {
    if (gameState === "PLAYING") hamster.jump();
    else if (gameState === "GAMEOVER") {
        gameState = "MENU";
        document.getElementById("main-menu").classList.remove("hidden");
    }
}

window.addEventListener("keydown", (e) => {
    if (e.code === "Space") handleInput();
});

canvas.addEventListener("click", handleInput);

updateUI();
requestAnimationFrame(loop);
</script>

</body>
</html>
