<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хомяк на шарике — Deluxe Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f121d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border-radius: 16px;
            overflow: hidden;
            width: 400px;
            height: 600px;
            background: #1a1a1a;
        }
        canvas {
            display: block;
            transform: translateZ(0);
            will-change: transform;
        }
        .ui-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(20, 15, 30, 0.85);
            backdrop-filter: blur(8px);
            z-index: 10;
        }
        .hidden { display: none !important; }

        /* ОБНОВЛЕННОЕ ГЛАВНОЕ МЕНЮ */
        #main-menu {
            background: radial-gradient(circle at center, rgba(40, 25, 55, 0.95), rgba(15, 10, 25, 0.98));
        }

        .game-title-container {
            text-align: center;
            margin-bottom: 25px;
            animation: floatTitle 3s ease-in-out infinite;
        }

        @keyframes floatTitle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1.main-title {
            color: #ff5e7e;
            font-size: 34px;
            margin-bottom: 4px;
            text-shadow: 0 4px 15px rgba(255, 94, 126, 0.6), 0 0 30px rgba(255, 94, 126, 0.2);
            font-weight: 900;
            letter-spacing: 1px;
        }

        .title-badge {
            display: inline-block;
            background: linear-gradient(90deg, #f1c40f, #e67e22);
            color: #1a1a1a;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 12px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 2px 10px rgba(241, 196, 15, 0.4);
        }

        .stats-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 12px 20px;
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 11px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .btn {
            background: linear-gradient(135deg, #ff5e7e, #e63956);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 30px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(230, 57, 86, 0.4);
            transition: all 0.2s ease;
            width: 220px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255,255,255,0.25), transparent);
            transform: rotate(30deg);
            transition: 0.5s;
        }

        .btn:hover::after {
            left: 100%;
        }

        .btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 8px 25px rgba(230, 57, 86, 0.6); }
        .btn:active { transform: translateY(1px); }
        
        .btn-shop { background: linear-gradient(135deg, #2ecc71, #27ae60); box-shadow: 0 6px 20px rgba(46, 204, 113, 0.4); }
        .btn-shop:hover { box-shadow: 0 8px 25px rgba(46, 204, 113, 0.6); }

        .btn-ach { background: linear-gradient(135deg, #f39c12, #d35400); box-shadow: 0 6px 20px rgba(243, 156, 18, 0.4); }
        .btn-ach:hover { box-shadow: 0 8px 25px rgba(243, 156, 18, 0.6); }

        .seeds-counter {
            position: absolute;
            top: 15px;
            right: 15px;
            font-weight: bold;
            font-size: 15px;
            color: #fff;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.5);
            backdrop-filter: blur(4px);
        }

        .shop-section { width: 90%; max-height: 400px; overflow-y: auto; text-align: center; }
        .shop-grid { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .shop-item {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px;
            width: 95px;
            cursor: pointer;
            font-size: 12px;
            color: #fff;
            font-weight: bold;
            transition: all 0.2s;
        }
        .shop-item.active { border-color: #2ecc71; background: rgba(46, 204, 113, 0.2); }
        .shop-item.bought { border-color: #ff5e7e; }
        .item-preview { width: 34px; height: 34px; border-radius: 50%; margin: 6px auto; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }

        .achievements-list {
            width: 90%;
            max-height: 380px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .ach-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
            transition: all 0.2s;
        }
        .ach-card.unlocked {
            background: rgba(46, 204, 113, 0.15);
            border-color: #2ecc71;
        }
        .ach-icon { font-size: 28px; }
        .ach-info { flex: 1; }
        .ach-title { font-weight: bold; font-size: 14px; color: #fff; }
        .ach-desc { font-size: 11px; color: #aaa; margin-top: 2px; }
        .ach-reward { font-size: 12px; color: #ffd700; font-weight: bold; margin-top: 4px; }

        #ach-toast {
            position: absolute;
            top: -70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(25, 20, 35, 0.95);
            border: 2px solid #ffd700;
            border-radius: 30px;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 20;
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }
        #ach-toast.show { top: 15px; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    
    <!-- ВСПЛЫВАЮЩЕЕ УВЕДОМЛЕНИЕ О ДОСТИЖЕНИИ -->
    <div id="ach-toast">
        <span id="toast-icon" style="font-size: 24px;">🏆</span>
        <div>
            <div style="font-size: 10px; color: #ffd700; font-weight: bold; text-transform: uppercase;">Достижение!</div>
            <div id="toast-title" style="font-size: 13px; font-weight: bold;">Название</div>
        </div>
    </div>

    <!-- ОБНОВЛЕННОЕ ГЛАВНОЕ МЕНЮ -->
    <div id="main-menu" class="ui-screen">
        <div class="game-title-container">
            <h1 class="main-title">Хомяк на шарике</h1>
            <span class="title-badge">Deluxe Edition</span>
        </div>

        <div class="stats-card">
            <div class="stat-item">
                <div class="stat-label">Рекорд</div>
                <div class="stat-value" style="color: #ff5e7e;" id="menu-highscore">0</div>
            </div>
            <div style="width: 1px; background: rgba(255,255,255,0.1);"></div>
            <div class="stat-item">
                <div class="stat-label">Семечки</div>
                <div class="stat-value" style="color: #ffd700;"><span class="seeds-val">0</span> 🌻</div>
            </div>
        </div>

        <div class="btn-container">
            <button class="btn" onclick="startGame()">Играть</button>
            <button class="btn btn-shop" onclick="openShop()">Магазин</button>
            <button class="btn btn-ach" onclick="openAchievements()">Ачивки</button>
        </div>
    </div>

    <!-- МАГАЗИН -->
    <div id="shop-menu" class="ui-screen hidden">
        <h1 style="color: #ff5e7e; font-size: 28px; margin-bottom: 15px;">Магазин</h1>
        <div class="seeds-counter">🌻 <span class="seeds-val">0</span></div>
        
        <div class="shop-section">
            <h2 style="color: #fceade; font-size: 16px; margin: 10px 0;">Цвет шарика (15 🌻)</h2>
            <div class="shop-grid" id="balloon-shop"></div>

            <h2 style="color: #fceade; font-size: 16px; margin: 15px 0 10px 0;">Цвет хомяка (20 🌻)</h2>
            <div class="shop-grid" id="hamster-shop"></div>
        </div>

        <button class="btn" style="margin-top: 20px; width: 160px; padding: 10px;" onclick="closeShop()">Назад</button>
    </div>

    <!-- МЕНЮ ДОСТИЖЕНИЙ -->
    <div id="achievements-menu" class="ui-screen hidden">
        <h1 style="color: #ff5e7e; font-size: 28px; margin-bottom: 15px;">Достижения</h1>
        <div class="seeds-counter">🌻 <span class="seeds-val">0</span></div>
        
        <div class="achievements-list" id="achievements-list"></div>

        <button class="btn" style="margin-top: 20px; width: 160px; padding: 10px;" onclick="closeAchievements()">Назад</button>
    </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// ==========================================
// ЗВУКОВОЙ ДВИЖОК (WEB AUDIO API)
// ==========================================
let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playSound(type) {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;

    if (type === 'jump') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(350, now);
        osc.frequency.exponentialRampToValueAtTime(700, now + 0.12);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
    } 
    else if (type === 'seed') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.setValueAtTime(1200, now + 0.06);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
    } 
    else if (type === 'pop') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
    } 
    else if (type === 'powerup') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(900, now + 0.2);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
    } 
    else if (type === 'score') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now); // C5
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
    }
}

// Сохранения
let seedsData = parseInt(localStorage.getItem("hamster_seeds")) || 0;
let highScore = parseInt(localStorage.getItem("hamster_highscore")) || 0;
let ownedSkins = JSON.parse(localStorage.getItem("hamster_skins")) || {
    balloon: ["#ff5e7e"],
    hamster: ["#d49b4b"]
};
let currentBalloon = localStorage.getItem("hamster_cur_balloon") || "#ff5e7e";
let currentHamster = localStorage.getItem("hamster_cur_hamster") || "#d49b4b";

let unlockedAchievements = JSON.parse(localStorage.getItem("hamster_achievements")) || [];

const ACHIEVEMENTS = [
    { id: "first_flight", icon: "🎈", title: "Первый полет", desc: "Сыграйте 1 игру", reward: 10 },
    { id: "score_10", icon: "🥉", title: "Набираем высоту", desc: "Наберите 10 очков за один залет", reward: 15 },
    { id: "score_30", icon: "🥇", title: "Покоритель небес", desc: "Наберите 30 очков за один залет", reward: 40 },
    { id: "collector_25", icon: "🌻", title: "Запасливый хомяк", desc: "Соберите суммарно 25 семечек", reward: 20 },
    { id: "shield_master", icon: "🛡️", title: "Под защитой", desc: "Используйте бонус Shield", reward: 15 },
    { id: "speed_demon", icon: "⚡", title: "Молния", desc: "Используйте бонус Boost", reward: 15 }
];

const BALLOON_COLORS = [
    { name: "Розовый", color: "#ff5e7e", price: 0 },
    { name: "Зеленый", color: "#2ecc71", price: 15 },
    { name: "Синий", color: "#3498db", price: 15 },
    { name: "Золотой", color: "#f1c40f", price: 30 }
];

const HAMSTER_COLORS = [
    { name: "Рыжий", color: "#d49b4b", price: 0 },
    { name: "Темный", color: "#34495e", price: 20 },
    { name: "Серый", color: "#7f8c8d", price: 20 },
    { name: "Персик", color: "#e67e22", price: 20 }
];

let gameState = "MENU";
let score = 0;
let seedsInGame = 0;
let gameSpeed = 160;
let spawnTimer = 0;
let globalTime = 0;

let shieldTime = 0;
let boostTime = 0;
let screenShake = 0; // Спецэффект тряски экрана

// Object Pools
const OBSTACLE_POOL_SIZE = 8;
const SEED_POOL_SIZE = 8;
const POWERUP_POOL_SIZE = 4;
const PARTICLE_POOL_SIZE = 40;
const TRAIL_POOL_SIZE = 20;
const FLOATING_TEXT_SIZE = 10;

const obstaclePool = Array.from({ length: OBSTACLE_POOL_SIZE }, () => ({
    x: 0, topHeight: 0, bottomY: 0, width: 54, gap: 145, active: false, passed: false
}));

const seedPool = Array.from({ length: SEED_POOL_SIZE }, () => ({
    x: 0, y: 0, radius: 10, rotation: 0, active: false
}));

const powerupPool = Array.from({ length: POWERUP_POOL_SIZE }, () => ({
    x: 0, y: 0, radius: 14, type: 'SHIELD', active: false
}));

const particlesPool = Array.from({ length: PARTICLE_POOL_SIZE }, () => ({
    x: 0, y: 0, size: 0, vx: 0, vy: 0, alpha: 0, active: false, color: "#fff"
}));

// Пул шлейфа за шариком
const trailPool = Array.from({ length: TRAIL_POOL_SIZE }, () => ({
    x: 0, y: 0, radius: 0, alpha: 0, active: false, color: "#fff"
}));

// Пул всплывающего текста (+1, +5)
const floatingTextPool = Array.from({ length: FLOATING_TEXT_SIZE }, () => ({
    x: 0, y: 0, text: "", alpha: 0, active: false, color: "#fff"
}));

function spawnFloatingText(x, y, text, color = "#ffd700") {
    let ft = floatingTextPool.find(t => !t.active);
    if (ft) {
        ft.x = x; ft.y = y; ft.text = text; ft.alpha = 1.0; ft.color = color; ft.active = true;
    }
}

// Детальный Хомяк
const hamster = {
    x: 80,
    y: 250,
    radius: 15,
    gravity: 1100,
    jumpForce: -340,
    velocity: 0,
    rotation: 0,
    isPopped: false,
    squashX: 1, // Деформация при прыжке
    squashY: 1,

    draw() {
        let hx = this.x | 0;
        let hy = this.y | 0;

        ctx.save();
        ctx.translate(hx, hy);

        let tilt = Math.min(Math.max(this.velocity / 600, -0.4), 0.4);
        if (!this.isPopped) {
            ctx.rotate(tilt);
            ctx.scale(this.squashX, this.squashY);
        }

        // 1. Воздушный шар
        if (!this.isPopped) {
            let bgGrad = ctx.createRadialGradient(-3, -20, 3, 0, -15, 18);
            bgGrad.addColorStop(0, '#ffffff');
            bgGrad.addColorStop(0.5, currentBalloon);
            bgGrad.addColorStop(1, adjustColor(currentBalloon, -40));

            ctx.beginPath();
            ctx.arc(0, -16, 17, 0, Math.PI * 2);
            ctx.fillStyle = bgGrad;
            ctx.fill();
            ctx.lineWidth = 1.8;
            ctx.strokeStyle = '#222';
            ctx.stroke();

            // Блик
            ctx.beginPath();
            ctx.ellipse(-6, -22, 4, 8, Math.PI / 4, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
            ctx.fill();

            // Узел
            ctx.beginPath();
            ctx.moveTo(-3, 1); ctx.lineTo(3, 1); ctx.lineTo(0, -2);
            ctx.closePath();
            ctx.fillStyle = adjustColor(currentBalloon, -30);
            ctx.fill();

            // Веревочка
            ctx.beginPath();
            ctx.moveTo(0, 1);
            ctx.quadraticCurveTo(4, 7, 0, 13);
            ctx.strokeStyle = "#555";
            ctx.lineWidth = 1.2;
            ctx.stroke();
        } else {
            ctx.rotate(this.rotation);
        }

        // 2. ДЕТАЛИЗИРОВАННЫЙ ХОМЯК
        let earColor = currentHamster;
        let earInner = "#ffbfa3";
        
        ctx.fillStyle = earColor;
        ctx.beginPath(); ctx.arc(-9, 11, 4.5, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#2c2c2c"; ctx.lineWidth = 1.2; ctx.stroke();
        ctx.fillStyle = earInner;
        ctx.beginPath(); ctx.arc(-9, 11, 2.3, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = earColor;
        ctx.beginPath(); ctx.arc(9, 11, 4.5, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#2c2c2c"; ctx.lineWidth = 1.2; ctx.stroke();
        ctx.fillStyle = earInner;
        ctx.beginPath(); ctx.arc(9, 11, 2.3, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = adjustColor(currentHamster, -20);
        ctx.beginPath(); ctx.ellipse(-10, 26, 5, 3, -0.2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(10, 26, 5, 3, 0.2, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#2c2c2c"; ctx.lineWidth = 1;
        ctx.stroke();

        let bodyGrad = ctx.createRadialGradient(-3, 18, 2, 0, 20, 14);
        bodyGrad.addColorStop(0, adjustColor(currentHamster, 25));
        bodyGrad.addColorStop(0.75, currentHamster);
        bodyGrad.addColorStop(1, adjustColor(currentHamster, -45));

        ctx.beginPath();
        ctx.ellipse(0, 20, 13, 11, 0, 0, Math.PI * 2);
        ctx.fillStyle = bodyGrad;
        ctx.fill();
        ctx.strokeStyle = "#2c2c2c"; ctx.lineWidth = 1.5; ctx.stroke();

        ctx.fillStyle = adjustColor(currentHamster, 30);
        ctx.beginPath();
        ctx.moveTo(-3, 10); ctx.lineTo(0, 6); ctx.lineTo(3, 10);
        ctx.fill();

        let bellyGrad = ctx.createLinearGradient(0, 14, 0, 27);
        bellyGrad.addColorStop(0, "#ffffff");
        bellyGrad.addColorStop(1, "#f7e3d0");
        ctx.beginPath();
        ctx.ellipse(0, 22.5, 7.5, 6, 0, 0, Math.PI * 2);
        ctx.fillStyle = bellyGrad; ctx.fill();

        let cheekGrad = ctx.createRadialGradient(-7, 19, 1, -7, 19, 6);
        cheekGrad.addColorStop(0, "rgba(255, 140, 160, 0.75)");
        cheekGrad.addColorStop(1, "rgba(255, 140, 160, 0)");
        ctx.fillStyle = cheekGrad;
        ctx.beginPath(); ctx.arc(-7, 19, 6, 0, Math.PI * 2); ctx.fill();

        let cheekGradR = ctx.createRadialGradient(7, 19, 1, 7, 19, 6);
        cheekGradR.addColorStop(0, "rgba(255, 140, 160, 0.75)");
        cheekGradR.addColorStop(1, "rgba(255, 140, 160, 0)");
        ctx.fillStyle = cheekGradR;
        ctx.beginPath(); ctx.arc(7, 19, 6, 0, Math.PI * 2); ctx.fill();

        ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-5, 19); ctx.lineTo(-14, 17);
        ctx.moveTo(-5, 20.5); ctx.lineTo(-13, 21);
        ctx.moveTo(5, 19); ctx.lineTo(14, 17);
        ctx.moveTo(5, 20.5); ctx.lineTo(13, 21);
        ctx.stroke();

        ctx.fillStyle = "#fff0db";
        ctx.beginPath(); ctx.ellipse(-5, 22, 3, 2, -0.3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(5, 22, 3, 2, 0.3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

        if (!this.isPopped) {
            ctx.fillStyle = "#3a2312";
            ctx.beginPath(); ctx.ellipse(0, 23, 2, 3.5, 0, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = "#f4c430"; ctx.lineWidth = 0.8; ctx.stroke();
        }

        if (this.isPopped) {
            ctx.strokeStyle = "#111"; ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-5, 14); ctx.lineTo(-1, 18); ctx.moveTo(-1, 14); ctx.lineTo(-5, 18);
            ctx.moveTo(1, 14); ctx.lineTo(5, 18); ctx.moveTo(5, 14); ctx.lineTo(1, 18);
            ctx.stroke();
        } else {
            let isBlinking = (Math.floor(globalTime * 3) % 12 === 0);
            if (isBlinking) {
                ctx.strokeStyle = "#111"; ctx.lineWidth = 1.8;
                ctx.beginPath();
                ctx.arc(-3.5, 16, 2, Math.PI, 0);
                ctx.arc(3.5, 16, 2, Math.PI, 0);
                ctx.stroke();
            } else {
                ctx.fillStyle = "#151515";
                ctx.beginPath(); ctx.arc(-3.5, 16, 2.2, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(3.5, 16, 2.2, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = "#ffffff";
                ctx.beginPath(); ctx.arc(-4.2, 15.2, 0.9, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(2.8, 15.2, 0.9, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(-2.8, 16.8, 0.4, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(4.2, 16.8, 0.4, 0, Math.PI * 2); ctx.fill();
            }
        }

        ctx.fillStyle = "#ff4777";
        ctx.beginPath(); ctx.arc(0, 18, 1.4, 0, Math.PI * 2); ctx.fill();
        
        ctx.strokeStyle = "#441a1a"; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, 18.8); ctx.lineTo(0, 20);
        ctx.moveTo(-1.8, 20); ctx.quadraticCurveTo(0, 21, 1.8, 20);
        ctx.stroke();

        ctx.fillStyle = "#fff";
        ctx.fillRect(-0.8, 20, 1.6, 1.5);

        if (shieldTime > 0 && !this.isPopped) {
            ctx.beginPath();
            ctx.arc(0, 3, 30, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(52, 152, 219, 0.25)"; ctx.fill();
            ctx.strokeStyle = "#3498db"; ctx.lineWidth = 2.5; ctx.stroke();
        }

        if (boostTime > 0 && !this.isPopped) {
            ctx.beginPath();
            ctx.arc(0, 3, 32, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(241, 196, 15, 0.25)"; ctx.fill();
            ctx.strokeStyle = "#f1c40f"; ctx.lineWidth = 2.5; ctx.stroke();
        }

        ctx.restore();
    },

    update(dt) {
        if (boostTime > 0) {
            this.velocity = (240 - this.y) * 7;
        } else {
            this.velocity += this.gravity * dt;
        }

        this.y += this.velocity * dt;

        // Восстановление формы после прыжка (Squash & Stretch)
        this.squashX += (1 - this.squashX) * 10 * dt;
        this.squashY += (1 - this.squashY) * 10 * dt;

        // Добавление частички шлейфа при полете
        if (gameState === "PLAYING" && Math.random() < 0.6) {
            let tr = trailPool.find(t => !t.active);
            if (tr) {
                tr.x = this.x - 5;
                tr.y = this.y - 16;
                tr.radius = Math.random() * 4 + 3;
                tr.alpha = 0.6;
                tr.color = boostTime > 0 ? "#f1c40f" : shieldTime > 0 ? "#3498db" : currentBalloon;
                tr.active = true;
            }
        }

        if (this.isPopped) this.rotation += 10 * dt;

        if (this.y + 26 >= canvas.height - 40) {
            this.y = canvas.height - 40 - 26;
            if (gameState === "DYING") finishGameOver();
        }

        if (this.y - 32 <= 0 && gameState === "PLAYING" && shieldTime <= 0 && boostTime <= 0) {
            triggerPop();
        }
    },

    jump() {
        if (!this.isPopped && boostTime <= 0) {
            this.velocity = this.jumpForce;
            this.squashX = 0.8; // Вытягиваем при прыжке
            this.squashY = 1.25;
            playSound('jump');
        }
    },

    reset() {
        this.y = 250;
        this.velocity = 0;
        this.rotation = 0;
        this.isPopped = false;
        this.squashX = 1;
        this.squashY = 1;
    }
};

function adjustColor(hex, lum) {
    hex = String(hex).replace(/[^0-9a-f]/gi, '');
    if (hex.length < 6) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
    let rgb = "#", c, i;
    for (i = 0; i < 3; i++) {
        c = parseInt(hex.substr(i*2,2), 16);
        c = Math.round(Math.min(Math.max(0, c + (c * (lum / 100))), 255)).toString(16);
        rgb += ("00"+c).substr(c.length);
    }
    return rgb;
}

function drawCactusHD(x, y, w, h, isTop) {
    let rx = x | 0;
    let ry = y | 0;

    ctx.save();
    
    let grad = ctx.createLinearGradient(rx, 0, rx + w, 0);
    grad.addColorStop(0, '#1e5128');
    grad.addColorStop(0.3, '#4e9f3d');
    grad.addColorStop(0.7, '#2e7d32');
    grad.addColorStop(1, '#1b4332');

    ctx.fillStyle = grad;
    ctx.fillRect(rx, ry, w, h);

    ctx.beginPath();
    let capY = isTop ? ry + h : ry;
    ctx.ellipse(rx + w / 2, capY, w / 2, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(rx + 12, ry); ctx.lineTo(rx + 12, ry + h);
    ctx.moveTo(rx + 27, ry); ctx.lineTo(rx + 27, ry + h);
    ctx.moveTo(rx + 42, ry); ctx.lineTo(rx + 42, ry + h);
    ctx.stroke();

    ctx.strokeStyle = "#d8f3dc";
    ctx.lineWidth = 1.5;
    for (let i = 15; i < h - 15; i += 24) {
        let cy = ry + i;
        ctx.beginPath();
        ctx.moveTo(rx, cy); ctx.lineTo(rx - 5, cy - 3);
        ctx.moveTo(rx + w, cy); ctx.lineTo(rx + w + 5, cy - 3);
        ctx.stroke();
    }

    ctx.strokeStyle = "#0d2818";
    ctx.lineWidth = 2;
    ctx.strokeRect(rx, ry, w, h);

    ctx.restore();
}

function spawnObstacle() {
    let obs = obstaclePool.find(o => !o.active);
    if (!obs) return;

    obs.x = canvas.width;
    obs.gap = 145;
    obs.topHeight = (Math.random() * (canvas.height - obs.gap - 160) + 50) | 0;
    obs.bottomY = obs.topHeight + obs.gap;
    obs.width = 54;
    obs.passed = false;
    obs.active = true;

    let rand = Math.random();
    if (rand < 0.06) {
        spawnPowerup(obs.x + 27, obs.topHeight + obs.gap / 2, 'BOOST');
    } else if (rand < 0.22) {
        spawnPowerup(obs.x + 27, obs.topHeight + obs.gap / 2, 'SHIELD');
    } else if (rand < 0.75) {
        spawnSeed(obs.x + 27, obs.topHeight + obs.gap / 2);
    }
}

function clearAheadObstacles(count = 3) {
    let activeObstacles = obstaclePool
        .filter(o => o.active && o.x + o.width > hamster.x - 30)
        .sort((a, b) => a.x - b.x);

    for (let i = 0; i < Math.min(count, activeObstacles.length); i++) {
        activeObstacles[i].active = false;
        for (let j = 0; j < 6; j++) {
            let p = particlesPool.find(pt => !pt.active);
            if (p) {
                p.x = activeObstacles[i].x + activeObstacles[i].width / 2;
                p.y = activeObstacles[i].topHeight + activeObstacles[i].gap / 2;
                p.size = Math.random() * 5 + 3;
                p.vx = (Math.random() - 0.5) * 300;
                p.vy = (Math.random() - 0.5) * 300;
                p.alpha = 1;
                p.color = "#2e7d32";
                p.active = true;
            }
        }
    }
}

function spawnSeed(x, y) {
    let s = seedPool.find(item => !item.active);
    if (s) {
        s.x = x; s.y = y; s.rotation = Math.random() * Math.PI; s.active = true;
    }
}

function spawnPowerup(x, y, type) {
    let p = powerupPool.find(item => !item.active);
    if (p) {
        p.x = x; p.y = y; p.type = type; p.active = true;
    }
}

function unlockAchievement(id) {
    if (unlockedAchievements.includes(id)) return;
    
    const ach = ACHIEVEMENTS.find(a => a.id === id);
    if (!ach) return;

    unlockedAchievements.push(id);
    seedsData += ach.reward;
    
    localStorage.setItem("hamster_achievements", JSON.stringify(unlockedAchievements));
    updateUI();

    const toast = document.getElementById("ach-toast");
    document.getElementById("toast-icon").textContent = ach.icon;
    document.getElementById("toast-title").textContent = ach.title;
    
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 3000);
}

function updateUI() {
    const val = seedsData.toString();
    document.querySelectorAll(".seeds-val").forEach(el => el.textContent = val);
    document.getElementById("menu-highscore").textContent = highScore;
    localStorage.setItem("hamster_seeds", seedsData);
    localStorage.setItem("hamster_highscore", highScore);
    localStorage.setItem("hamster_skins", JSON.stringify(ownedSkins));
    localStorage.setItem("hamster_cur_balloon", currentBalloon);
    localStorage.setItem("hamster_cur_hamster", currentHamster);
}

function startGame() {
    initAudio();
    document.getElementById("main-menu").classList.add("hidden");
    document.getElementById("shop-menu").classList.add("hidden");
    document.getElementById("achievements-menu").classList.add("hidden");
    unlockAchievement("first_flight");
    resetGame();
}

function openShop() {
    initAudio();
    renderShop();
    document.getElementById("main-menu").classList.add("hidden");
    document.getElementById("shop-menu").classList.remove("hidden");
}

function closeShop() {
    document.getElementById("shop-menu").classList.add("hidden");
    document.getElementById("main-menu").classList.remove("hidden");
}

function openAchievements() {
    initAudio();
    renderAchievements();
    document.getElementById("main-menu").classList.add("hidden");
    document.getElementById("achievements-menu").classList.remove("hidden");
}

function closeAchievements() {
    document.getElementById("achievements-menu").classList.add("hidden");
    document.getElementById("main-menu").classList.remove("hidden");
}

function renderAchievements() {
    updateUI();
    const list = document.getElementById("achievements-list");
    list.innerHTML = "";

    ACHIEVEMENTS.forEach(ach => {
        const isUnlocked = unlockedAchievements.includes(ach.id);
        const card = document.createElement("div");
        card.className = `ach-card ${isUnlocked ? 'unlocked' : ''}`;
        card.innerHTML = `
            <div class="ach-icon">${ach.icon}</div>
            <div class="ach-info">
                <div class="ach-title">${ach.title}</div>
                <div class="ach-desc">${ach.desc}</div>
                <div class="ach-reward">${isUnlocked ? '✓ Получено' : '+' + ach.reward + ' 🌻'}</div>
            </div>
        `;
        list.appendChild(card);
    });
}

function renderShop() {
    updateUI();
    const bShop = document.getElementById("balloon-shop");
    const hShop = document.getElementById("hamster-shop");
    bShop.innerHTML = "";
    hShop.innerHTML = "";

    BALLOON_COLORS.forEach(item => {
        const bought = ownedSkins.balloon.includes(item.color);
        const active = currentBalloon === item.color;
        const div = document.createElement("div");
        div.className = `shop-item ${active ? 'active' : ''} ${bought ? 'bought' : ''}`;
        div.innerHTML = `
            <div class="item-preview" style="background:${item.color}"></div>
            <div>${item.name}</div>
            <div style="margin-top:4px; color:${active ? '#2ecc71' : '#fff'}">${active ? 'Надет' : bought ? 'Выбрать' : item.price + ' 🌻'}</div>
        `;
        div.onclick = () => buySkin('balloon', item);
        bShop.appendChild(div);
    });

    HAMSTER_COLORS.forEach(item => {
        const bought = ownedSkins.hamster.includes(item.color);
        const active = currentHamster === item.color;
        const div = document.createElement("div");
        div.className = `shop-item ${active ? 'active' : ''} ${bought ? 'bought' : ''}`;
        div.innerHTML = `
            <div class="item-preview" style="background:${item.color}"></div>
            <div>${item.name}</div>
            <div style="margin-top:4px; color:${active ? '#2ecc71' : '#fff'}">${active ? 'Надет' : bought ? 'Выбрать' : item.price + ' 🌻'}</div>
        `;
        div.onclick = () => buySkin('hamster', item);
        hShop.appendChild(div);
    });
}

function buySkin(type, item) {
    if (ownedSkins[type].includes(item.color)) {
        if (type === 'balloon') currentBalloon = item.color;
        if (type === 'hamster') currentHamster = item.color;
    } else if (seedsData >= item.price) {
        seedsData -= item.price;
        ownedSkins[type].push(item.color);
        if (type === 'balloon') currentBalloon = item.color;
        if (type === 'hamster') currentHamster = item.color;
    }
    renderShop();
}

function triggerPop() {
    if (gameState === "PLAYING") {
        gameState = "DYING";
        hamster.isPopped = true;
        hamster.velocity = -240;
        screenShake = 0.3; // Активируем тряску экрана
        playSound('pop');
        
        for (let i = 0; i < PARTICLE_POOL_SIZE; i++) {
            particlesPool[i] = {
                x: hamster.x, y: hamster.y - 15, size: Math.random() * 4 + 2.5,
                vx: (Math.random() - 0.5) * 450, vy: (Math.random() - 0.5) * 450,
                alpha: 1, active: true, color: currentBalloon
            };
        }
    }
}

function finishGameOver() {
    gameState = "GAMEOVER";
    if (score > highScore) highScore = score;
    seedsData += seedsInGame;
    
    if (seedsData >= 25) unlockAchievement("collector_25");

    updateUI();
}

function checkCollision(obs) {
    if (shieldTime > 0 || boostTime > 0) return false;
    if (hamster.x + hamster.radius > obs.x && hamster.x - hamster.radius < obs.x + obs.width) {
        if (hamster.y - 25 < obs.topHeight || hamster.y + 25 > obs.bottomY) return true;
    }
    return false;
}

function resetGame() {
    hamster.reset();
    obstaclePool.forEach(o => o.active = false);
    seedPool.forEach(s => s.active = false);
    powerupPool.forEach(p => p.active = false);
    particlesPool.forEach(p => p.active = false);
    trailPool.forEach(t => t.active = false);
    floatingTextPool.forEach(ft => ft.active = false);
    
    score = 0;
    seedsInGame = 0;
    spawnTimer = 0;
    shieldTime = 0;
    boostTime = 0;
    screenShake = 0;
    gameSpeed = 160;
    gameState = "PLAYING";
}

let lastTime = performance.now();

function loop(now) {
    let dt = (now - lastTime) / 1000;
    if (dt > 0.1) dt = 0.1;
    lastTime = now;
    globalTime += dt;

    if (gameState === "PLAYING") {
        if (shieldTime > 0) shieldTime -= dt;

        if (boostTime > 0) {
            boostTime -= dt;
            gameSpeed = 400;
            if (boostTime <= 0) {
                boostTime = 0;
                gameSpeed = 160;
                clearAheadObstacles(3);
            }
        } else {
            gameSpeed = 160;
        }

        spawnTimer += dt;
        let spawnInterval = boostTime > 0 ? 0.55 : 1.5;
        if (spawnTimer >= spawnInterval) {
            spawnTimer = 0;
            spawnObstacle();
        }
    }

    // Тряска экрана при взрыве
    ctx.save();
    if (screenShake > 0) {
        screenShake -= dt;
        let shakeX = (Math.random() - 0.5) * 12;
        let shakeY = (Math.random() - 0.5) * 12;
        ctx.translate(shakeX, shakeY);
    }

    // Детализированный Фон
    let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    bgGrad.addColorStop(0, '#f9eae1');
    bgGrad.addColorStop(0.7, '#f7d6c1');
    bgGrad.addColorStop(1, '#e3a882');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
    for (let x = 0; x < canvas.width; x += 40) {
        ctx.fillRect(x, 0, 2, canvas.height - 40);
    }

    // Окно
    ctx.fillStyle = "#a8dadc";
    ctx.fillRect(230, 70, 120, 140);
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 6;
    ctx.strokeRect(230, 70, 120, 140);
    ctx.beginPath();
    ctx.moveTo(290, 70); ctx.lineTo(290, 210);
    ctx.moveTo(230, 140); ctx.lineTo(350, 140);
    ctx.stroke();
    ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
    ctx.beginPath(); ctx.arc(260, 110, 14, 0, Math.PI * 2); ctx.arc(275, 105, 18, 0, Math.PI * 2); ctx.arc(295, 110, 14, 0, Math.PI * 2); ctx.fill();

    // Деревянный пол
    let floorGrad = ctx.createLinearGradient(0, canvas.height - 40, 0, canvas.height);
    floorGrad.addColorStop(0, '#8d5b4c');
    floorGrad.addColorStop(1, '#5c3a2f');
    ctx.fillStyle = floorGrad;
    ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
    ctx.fillStyle = '#4a2c22';
    ctx.fillRect(0, canvas.height - 40, canvas.width, 4);

    if (gameState === "PLAYING" || gameState === "DYING" || gameState === "GAMEOVER") {
        hamster.update(dt);

        // Отрисовка Шлейфа
        for (let i = 0; i < TRAIL_POOL_SIZE; i++) {
            let tr = trailPool[i];
            if (!tr.active) continue;
            tr.x -= gameSpeed * dt * 0.5;
            tr.alpha -= 1.8 * dt;
            tr.radius -= 2 * dt;
            if (tr.alpha <= 0 || tr.radius <= 0) {
                tr.active = false;
            } else {
                ctx.fillStyle = tr.color;
                ctx.globalAlpha = Math.max(0, tr.alpha);
                ctx.beginPath();
                ctx.arc(tr.x, tr.y, tr.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        // Препятствия
        for (let i = 0; i < OBSTACLE_POOL_SIZE; i++) {
            let obs = obstaclePool[i];
            if (!obs.active) continue;

            if (gameState === "PLAYING") {
                obs.x -= gameSpeed * dt;
                if (!obs.passed && obs.x + obs.width < hamster.x) {
                    score++;
                    obs.passed = true;
                    playSound('score');
                    spawnFloatingText(hamster.x, hamster.y - 20, "+1", "#2ecc71");
                    if (score >= 10) unlockAchievement("score_10");
                    if (score >= 30) unlockAchievement("score_30");
                }
                if (checkCollision(obs)) triggerPop();
                if (obs.x + obs.width < 0) obs.active = false;
            }

            drawCactusHD(obs.x, 0, obs.width, obs.topHeight, true);
            drawCactusHD(obs.x, obs.bottomY, obs.width, canvas.height - obs.bottomY - 40, false);
        }

        // Семечки
        for (let i = 0; i < SEED_POOL_SIZE; i++) {
            let s = seedPool[i];
            if (!s.active) continue;

            if (gameState === "PLAYING") {
                s.x -= gameSpeed * dt;
                let dist = Math.hypot(hamster.x - s.x, hamster.y - s.y);
                if (dist < hamster.radius + s.radius) {
                    s.active = false;
                    seedsInGame += 5;
                    playSound('seed');
                    spawnFloatingText(s.x, s.y, "+5 🌻", "#ffd700");
                }
                if (s.x < -20) s.active = false;
            }

            if (s.active) {
                ctx.save();
                ctx.translate(s.x | 0, s.y | 0);
                ctx.rotate(s.rotation);
                
                let seedGrad = ctx.createLinearGradient(-5, -8, 5, 8);
                seedGrad.addColorStop(0, '#4a3222');
                seedGrad.addColorStop(0.5, '#2b1a10');
                seedGrad.addColorStop(1, '#150d08');

                ctx.beginPath();
                ctx.ellipse(0, 0, 5, 9, 0, 0, Math.PI * 2);
                ctx.fillStyle = seedGrad; ctx.fill();
                ctx.strokeStyle = "#f4c430"; ctx.lineWidth = 1.2; ctx.stroke();

                ctx.restore();
            }
        }

        // Бонусы
        for (let i = 0; i < POWERUP_POOL_SIZE; i++) {
            let p = powerupPool[i];
            if (!p.active) continue;

            if (gameState === "PLAYING") {
                p.x -= gameSpeed * dt;
                let dist = Math.hypot(hamster.x - p.x, hamster.y - p.y);
                if (dist < hamster.radius + p.radius) {
                    p.active = false;
                    playSound('powerup');
                    if (p.type === 'SHIELD') {
                        shieldTime = 5.0;
                        unlockAchievement("shield_master");
                        spawnFloatingText(p.x, p.y, "SHIELD!", "#3498db");
                    } else if (p.type === 'BOOST') {
                        boostTime = 5.0;
                        unlockAchievement("speed_demon");
                        spawnFloatingText(p.x, p.y, "BOOST!", "#f1c40f");
                    }
                }
                if (p.x < -20) p.active = false;
            }

            if (p.active) {
                ctx.save();
                ctx.translate(p.x | 0, p.y | 0);
                
                let pGrad = ctx.createRadialGradient(-2, -2, 2, 0, 0, p.radius);
                if (p.type === 'SHIELD') {
                    pGrad.addColorStop(0, '#5dede7'); pGrad.addColorStop(1, '#0077b6');
                } else {
                    pGrad.addColorStop(0, '#fff07c'); pGrad.addColorStop(1, '#f77f00');
                }

                ctx.beginPath(); ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = pGrad; ctx.fill();
                ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.8; ctx.stroke();

                ctx.fillStyle = "#fff"; ctx.font = "bold 13px sans-serif";
                ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(p.type === 'SHIELD' ? "🛡️" : "⚡", 0, 1);
                ctx.restore();
            }
        }

        // Частицы взрыва
        for (let i = 0; i < PARTICLE_POOL_SIZE; i++) {
            let p = particlesPool[i];
            if (!p.active) continue;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy += 450 * dt;
            p.alpha -= 0.85 * dt;

            if (p.alpha <= 0) {
                p.active = false;
            } else {
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x | 0, p.y | 0, p.size, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        // Всплывающие очки / сообщения
        for (let i = 0; i < FLOATING_TEXT_SIZE; i++) {
            let ft = floatingTextPool[i];
            if (!ft.active) continue;
            ft.y -= 40 * dt;
            ft.alpha -= 1.2 * dt;

            if (ft.alpha <= 0) {
                ft.active = false;
            } else {
                ctx.globalAlpha = Math.max(0, ft.alpha);
                ctx.fillStyle = ft.color;
                ctx.font = "800 16px 'Segoe UI', sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.globalAlpha = 1.0;
            }
        }
    }

    if (gameState !== "MENU") hamster.draw();
    drawUI();

    ctx.restore(); // Сброс контекста после shake
    requestAnimationFrame(loop);
}

function drawUI() {
    if (gameState === "PLAYING" || gameState === "DYING") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
        ctx.roundRect(12, 12, 110, 55, 10);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.font = "800 18px 'Segoe UI', sans-serif";
        ctx.textAlign = "left";
        ctx.fillText(`Счёт: ${score}`, 22, 35);

        ctx.font = "bold 12px 'Segoe UI', sans-serif";
        ctx.fillStyle = "#ffbfa3";
        ctx.fillText(`Рекорд: ${highScore}`, 22, 55);

        ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
        ctx.roundRect(270, 12, 118, 36, 10);
        ctx.fill();

        ctx.textAlign = "right";
        ctx.font = "bold 16px 'Segoe UI', sans-serif";
        ctx.fillStyle = "#ffd700";
        ctx.fillText(`🌻 ${seedsData + seedsInGame}`, 376, 36);

        let barY = 20;
        if (shieldTime > 0) {
            ctx.fillStyle = "rgba(52, 152, 219, 0.8)";
            ctx.fillRect(132, barY, (shieldTime / 5.0) * 130, 8);
            ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1; ctx.strokeRect(132, barY, 130, 8);
            barY += 14;
        }
        if (boostTime > 0) {
            ctx.fillStyle = "rgba(241, 196, 15, 0.8)";
            ctx.fillRect(132, barY, (boostTime / 5.0) * 130, 8);
            ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1; ctx.strokeRect(132, barY, 130, 8);
        }

    } else if (gameState === "GAMEOVER") {
        ctx.textAlign = "center";
        ctx.fillStyle = "rgba(25, 20, 35, 0.92)";
        ctx.roundRect(40, 150, 320, 260, 16);
        ctx.fill();
        ctx.strokeStyle = "#ff5e7e"; ctx.lineWidth = 2; ctx.stroke();

        ctx.fillStyle = "#ff5e7e";
        ctx.font = "800 28px sans-serif";
        ctx.fillText("ЛОПНУЛ!", canvas.width / 2, 195);

        ctx.fillStyle = "#ffffff";
        ctx.font = "18px sans-serif";
        ctx.fillText(`Очки: ${score}`, canvas.width / 2, 240);
        ctx.fillText(`Собрано: +${seedsInGame} 🌻`, canvas.width / 2, 275);
        ctx.fillText(`Рекорд: ${highScore}`, canvas.width / 2, 310);

        ctx.font = "14px sans-serif";
        ctx.fillStyle = "#aaa";
        ctx.fillText("Кликните для выхода в меню", canvas.width / 2, 370);
        ctx.textAlign = "left";
    }
}

if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        this.beginPath();
        this.moveTo(x + r, y);
        this.arcTo(x + w, y, x + w, y + h, r);
        this.arcTo(x + w, y + h, x, y + h, r);
        this.arcTo(x, y + h, x, y, r);
        this.arcTo(x, y, x + w, y, r);
        this.closePath();
        return this;
    };
}

function handleInput() {
    initAudio();
    if (gameState === "PLAYING") hamster.jump();
    else if (gameState === "GAMEOVER") {
        gameState = "MENU";
        document.getElementById("main-menu").classList.remove("hidden");
    }
}

window.addEventListener("keydown", (e) => {
    if (e.code === "Space") handleInput();
});

canvas.addEventListener("click", handleInput);

updateUI();
requestAnimationFrame(loop);
</script>

</body>
